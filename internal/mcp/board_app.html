    || (params && params.structuredContent) || {}
  const d = (carried.board || carried.inbox || carried.events)
    ? carried
    : { ...carried, ...(contentState(params) || {}) }
  const previousInbox = new Set(state.inbox.map((m) => m.serial))
  // Status, not just presence. A lane going out of touch is the most
  // consequential change this board can show — an agent stopped answering and
  // work may be sitting behind it — and it was the one that happened in total
  // silence: the entry restyled and re-sorted between two frames, which is
  // invisible to anyone not already staring at that row.
  const previousLanes = new Map(
    (state.board?.lanes || []).map((lane) => [lane.id, lane.status]))
  if (d.board) { state.board = d.board; state.unreachable = null }
  // inbox arrives as {messages:[…]}; tolerate a bare array so the panel never
  // renders "nothing waiting" over a full mailbox.
  if (d.inbox) {
    state.inbox = Array.isArray(d.inbox) ? d.inbox : d.inbox.messages || []
    // An authoritative mailbox push retires optimistic action state. This is
    // how a "sent, refresh failed" notice heals when the next host update
    // arrives instead of sticking around forever over a settled message.
    const current = new Map(state.inbox.map((m) => [m.serial, m]))
    for (const serial of state.settled.keys()) {
      const message = current.get(serial)
      if (!message || Board.TERMINAL.has(message.state)) state.settled.delete(serial)
    }
    for (const serial of state.errors.keys()) {
      const message = current.get(serial)
      if (!message || Board.TERMINAL.has(message.state)) state.errors.delete(serial)
    }
  }
  if (d.lane_id) state.lane = d.lane_id
  if (d.act_token) state.token = d.act_token
  if (d.events) state.events = d.events

  const arrivals = state.received
    ? state.inbox.filter((m) => !previousInbox.has(m.serial))
    : []
  const laneArrivals = state.received
    ? (state.board?.lanes || []).filter((lane) => !previousLanes.has(lane.id))
    : []
  // Only a lane we were already watching, and only on the way IN to stale.
  // A lane that arrives already stale has not changed — it is simply how we
  // first met it — and marking that would spend the operator's attention on
  // history rather than on news.
  const wentQuiet = state.received
    ? (state.board?.lanes || []).filter((lane) =>
        lane.status === "stale" &&
        previousLanes.has(lane.id) &&
        previousLanes.get(lane.id) !== "stale")
    : []
  // Any change of band, not only the one into stale.
  //
  // The board groups lanes by status, so a status change is also a change of
  // PLACE: the row leaves one group and appears in another, several hundred
  // pixels away, between two frames. Without motion that is indistinguishable
  // from two unrelated edits — one row vanished here, an identical row appeared
  // there — and the single most useful fact on the board, that this particular
  // agent just changed state, is the one thing the reader has to reconstruct.
  // Waking up matters as much as going quiet, which is why this is every band
  // move and not a second copy of wentQuiet.
  const bandMoves = state.received
    ? (state.board?.lanes || []).filter((lane) =>
        previousLanes.has(lane.id) && previousLanes.get(lane.id) !== lane.status)
    : []
  const requestedView = ["mail", "board", "lanes", "activity"].includes(d.view)
    ? d.view
    : null
  const requestedTabChange = requestedView && requestedView !== activeView
  let transitionKind = ""
  if (requestedTabChange) transitionKind = tabDirection(activeView, requestedView)
  else if (arrivals.length && activeView === "mail") transitionKind = "mail-arrival"
  else if (laneArrivals.length && activeView === "board") transitionKind = "lane-arrival"
  // A band move outranks nothing above it and everything below: an arrival is a
  // lane we have never seen, a band move is a lane we know changing state, and
  // only the second one has an origin worth travelling from.
  else if (bandMoves.length && activeView === "board") transitionKind = "lane-band"

  const update = (enhanced) => {
    draw()
    if (requestedView)
      commitTab(requestedView, { fallbackMotion: !enhanced })
    if (arrivals.length) {
      const tally = document.getElementById("tally-mail")
      tally.classList.remove("bump")
      void tally.offsetWidth
      tally.classList.add("bump")
    }
    for (const lane of wentQuiet) {
      const entry = document.querySelector('.entry[data-lane="' + CSS.escape(lane.id) + '"]')
      if (!entry) continue
      entry.classList.remove("went-quiet")
      void entry.offsetWidth
      entry.classList.add("went-quiet")
    }
  }
  // Ordinary authoritative pushes stay synchronous. Besides preserving the
  // transport contract, this keeps a liveness change or healed action notice
  // from waiting behind a decorative snapshot. Only the three changes whose
  // geometry benefits from explanation enter the transition pipeline.
  if (transitionKind) runPanelTransition(transitionKind, update)
  else update(false)

  if (arrivals.length) {
    const first = arrivals[0]
    announce(arrivals.length === 1
      ? `New ${first.type || "message"} from ${first.from || "another lane"}`
      : `${arrivals.length} new messages`)
  }
  state.received = true
  maybeShareMailWithAgent()

  // A push that carried no state at all is a host that dropped the panel
  // payload out of _meta. Go and get it — see fetchBoard, which also decides
  // when there is no way to and says so.
  if (!state.board && !d.board && !d.inbox) fetchBoard()
}

// ── views ────────────────────────────────────────────────────
const NAV = [...document.querySelectorAll(".views button")]
const VIEW_ORDER = NAV.map((button) => button.dataset.view)
let activeView = "board"
function tabDirection(from, to) {
  return VIEW_ORDER.indexOf(to) >= VIEW_ORDER.indexOf(from)
    ? "tab-forward"
    : "tab-back"
}

function commitTab(which, {
  focus = false,
  fallbackMotion = false,
} = {}) {
  if (!NAV.some((btn) => btn.dataset.view === which)) return
  const changed = which !== activeView
  activeView = which
  for (const btn of NAV) {
    const on = btn.dataset.view === which
    btn.setAttribute("aria-selected", String(on))
    btn.tabIndex = on ? 0 : -1
    const panel = document.getElementById("pane-" + btn.dataset.view)
    panel.classList.toggle("hide", !on)
    panel.hidden = !on
    if (on && focus) btn.focus()
  }
  const pane = document.getElementById("pane-" + which)
  if (pane && changed && fallbackMotion) {
    pane.classList.remove("entering")
    void pane.offsetWidth
    pane.classList.add("entering")
    setTimeout(() => pane.classList.remove("entering"), 300)
  }
}

function tab(which, { focus = false } = {}) {
  if (!NAV.some((btn) => btn.dataset.view === which)) return
  if (which === activeView) {
    commitTab(which, { focus })
    return
  }
  const direction = tabDirection(activeView, which)
  runPanelTransition(direction, (enhanced) => {
    commitTab(which, { focus, fallbackMotion: !enhanced })
  })
}
for (const btn of NAV) btn.onclick = () => tab(btn.dataset.view)
document.querySelector(".views").onkeydown = (e) => {
  const current = NAV.indexOf(document.activeElement)
  if (current < 0) return
  let next = null
  if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (current + 1) % NAV.length
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (current - 1 + NAV.length) % NAV.length
  if (e.key === "Home") next = 0
  if (e.key === "End") next = NAV.length - 1
  if (next == null) return
  e.preventDefault()
  tab(NAV[next].dataset.view, { focus: true })
}

// ── handshake ────────────────────────────────────────────────
// Paint before talking to anyone. An earlier version drew only after
// ui/initialize settled — so a host that never answered left the panel blank for
// the full timeout, and a host that sizes its container to content saw an empty
// box and showed the human nothing. First paint must never depend on a reply
// that may not come.
// The human's button, wired before first paint so it is live the moment the
// panel is: an affordance that appears and then does nothing for a second is
// worse than one that appears late.
document.getElementById("human-lock").onclick = () => { void unlockHuman() }
setHumanState("locked")

draw()
tab("board")

;(async () => {
  try {
    // Field names are load-bearing. The host validates this against a zod
    // schema requiring appInfo / appCapabilities / protocolVersion. Sending
    // clientInfo + capabilities — the shape base MCP uses — is REJECTED, and a
    // rejected handshake is silent: the panel simply never comes up.
    const init = await call("ui/initialize", {
      appInfo: { name: "lanes-board", version: "2" },
      appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      protocolVersion: "2026-01-26",
    })
    host.caps = init?.hostCapabilities || {}
    host.name = init?.hostInfo?.name || ""
    host.version = init?.hostInfo?.version || ""
    host.proto = init?.protocolVersion || ""
    // The host is authoritative for theme and may also provide standardized
    // MCP Apps tokens. A dark OS with light host chrome must still get a light
    // panel, and later theme changes must not require a reload.
    applyHostContext(init?.hostContext || {})

    // The host waits for this before treating the app as live.
    notify("ui/notifications/initialized", {})
    maybeShareMailWithAgent()
    startSizeReporting()
  } catch (_) { /* no handshake — we already painted; report size anyway */ }
  draw()
  reportSize()
})()
</script>
</body>
</html>
