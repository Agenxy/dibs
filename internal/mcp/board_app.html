<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark light" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lanes — Board</title>
<style>/*__STYLES__*/</style>
<style>
/* The shared sheet is the product language. The panel adds one piece of its
   own: a datum rail. An MCP App never owns the surrounding canvas or even its
   width, so it behaves like a calibrated instrument inserted into the host:
   one persistent axis, and every live record registered against it. */
.panel {
  container: lanes-panel / inline-size;
  --panel-gutter: var(--s6);
  --panel-rail-size: 30px;
  --panel-rail-gap: var(--s3);
  --panel-rail-reach: calc(var(--panel-rail-size) / 2 + var(--panel-rail-gap));
  --panel-register: var(--accent);
  --panel-record-signal: var(--line-3);
}

.panel .sheet {
  min-width: 0;
  isolation: isolate;
  background:
    radial-gradient(
      circle at calc(var(--panel-gutter) + var(--panel-rail-size) / 2) var(--s7),
      color-mix(in oklch, var(--panel-register) 9%, transparent),
      transparent var(--s7)
    ),
    radial-gradient(
      ellipse at 88% 7rem,
      color-mix(in oklch, var(--live) 4%, transparent),
      transparent 19rem
    ),
    linear-gradient(
      180deg,
      color-mix(in oklch, var(--fg) 3%, transparent),
      transparent 9rem
    ),
    color-mix(in oklch, var(--bg) 96%, transparent);
}

/* Texture, and the argument for why it is allowed to exist.
 *
 * A flat fill reads as an absence — the surface has no material, so everything
 * on it floats rather than sitting. What it must NOT become is decoration: a
 * grain loud enough to notice is a pattern competing with text that people are
 * reading to decide whether to interrupt somebody's work.
 *
 * So the weave is built from the palette (never a raw colour), it is 2px on the
 * diagonal, and it is mixed at a strength where you can see the surface has a
 * tooth but cannot resolve the lines. It sits UNDER everything via a
 * pseudo-element at z-index 0, so no text ever renders on top of a moving edge,
 * and it is dropped entirely at high contrast, where the whole point is that
 * nothing sits between the reader and the glyphs. */
.panel .sheet::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    45deg,
    color-mix(in oklch, var(--fg) 1.6%, transparent) 0 1px,
    transparent 1px 3px
  );
  mask-image: linear-gradient(180deg, var(--fg), transparent 32rem);
}
@media (prefers-contrast: more) {
  .panel .sheet::after { display: none; }
}

/* The rail groups every status band and record under one origin, and that is
   ALL it does now.
   It used to carry fine cross-ticks, described here as giving it "scale". They
   gave it the LOOK of scale: a ruler implies a measure, and nothing was being
   measured — the marks were evenly spaced regardless of time, count or anything
   else on screen. Read back by somebody who had not written it, the panel was
   "sci-fi HUD costume", and they were right. An instrument that decorates itself
   with instrument-shaped marks is harder to trust, not easier.
   The continuous line stays because it is doing structural work. */
.panel .sheet::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: var(--s5);
  bottom: var(--s5);
  left: calc(
    var(--panel-gutter) +
    (var(--panel-rail-size) - var(--s3)) / 2
  );
  width: var(--s3);
  pointer-events: none;
  background:
    linear-gradient(
      90deg,
      transparent calc(50% - .5px),
      color-mix(in oklch, var(--panel-register) 48%, var(--line-2))
        calc(50% - .5px) calc(50% + .5px),
      transparent calc(50% + .5px)
    ),
    none;
  mask-image: linear-gradient(
    180deg,
    transparent,
    var(--fg) var(--s5),
    var(--fg) calc(100% - var(--s7)),
    transparent
  );
}
.panel .sheet > * {
  position: relative;
  z-index: 1;
}
.panel :is(.hairline, .context, .summary, main, .foot) {
  margin-left: calc(var(--panel-rail-size) + var(--panel-rail-gap));
}

/* A compact instrument deck, not a reduced web page. The register remains
   visually subordinate to the host, but bevelled corners keep it from becoming
   the generic pill control that appears in every other sidebar. */
.panel .masthead {
  position: relative;
  z-index: 2;
}
.panel .views {
  padding: var(--s1);
  border: 1px solid color-mix(in oklch, var(--line-2) 76%, transparent);
  border-radius: calc(var(--r) * 1.6);
  corner-shape: bevel;
  background: color-mix(in oklch, var(--bg-1) 82%, transparent);
  box-shadow:
    inset 0 1px 0 color-mix(in oklch, var(--fg) 5%, transparent),
    inset 0 calc(var(--s1) * -1) var(--s3)
      color-mix(in oklch, var(--bg) 16%, transparent);
}

.panel .views button {
  position: relative;
  min-height: 32px;
  overflow: clip;
  z-index: 0;
  corner-shape: bevel;
}
.panel .views button::after {
  content: "";
  position: absolute;
  right: var(--s2);
  bottom: var(--s1);
  left: var(--s2);
  height: 2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--accent) 28% 72%,
      transparent
    );
  box-shadow: 0 0 var(--s3) color-mix(in oklch, var(--accent) 58%, transparent);
  clip-path: polygon(
    0 50%,
    var(--s1) 0,
    calc(100% - var(--s1)) 0,
    100% 50%,
    calc(100% - var(--s1)) 100%,
    var(--s1) 100%
  );
  transform: scaleX(0);
  transform-origin: 0 50%;
  transition: transform .2s var(--ease);
}
.panel .views button[aria-selected="true"] {
  background:
    linear-gradient(
      180deg,
      color-mix(in oklch, var(--accent) 13%, var(--bg-2)),
      color-mix(in oklch, var(--accent) 5%, var(--bg-2))
    );
  box-shadow: inset 0 1px 0 color-mix(in oklch, var(--fg) 7%, transparent);
}
.panel .views button[aria-selected="true"]::after { transform: scaleX(1); }
.panel .views button[data-view="mail"] .tally:not(.zero) {
  min-width: 1.4em;
  padding: 0 var(--s1);
  border: 1px solid color-mix(in oklch, var(--warn) 42%, transparent);
  background: color-mix(in oklch, var(--warn) 12%, transparent);
  color: var(--warn);
  font-weight: 600;
}
.panel .views .tally.bump { animation: tally-bump .28s var(--ease); }
@keyframes tally-bump {
  50% { transform: translateY(-1px) scale(1.12); }
}

/* Shared children do not replay entrance motion on every live board push. The
   fallback below runs only for an intentional tab change; capable browsers use
   the View Transition treatment farther down to preserve spatial continuity. */
.panel .view > * { animation: none; }
.panel .view.entering > * { animation: rise .24s var(--ease) both; }

/* Four telemetry readings share one aperture. This is the eye of the
   instrument, not four dashboard cards: internal rules establish the columns,
   a semantic register line warms only when one of the readings needs
   attention, and the chamfer survives at every host width. */
.panel .summary {
  --panel-summary-signal: var(--accent);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  padding: var(--s1);
  border: 1px solid color-mix(in oklch, var(--line-2) 72%, transparent);
  border-radius: calc(var(--r) * 2);
  corner-shape: bevel;
  background: color-mix(in oklch, var(--bg) 97%, var(--bg-1));
  box-shadow:
    inset 0 1px 0 color-mix(in oklch, var(--fg) 5%, transparent),
    inset 0 calc(var(--s1) * -1) var(--s4)
      color-mix(in oklch, var(--bg) 18%, transparent);
}
.panel .summary:has(.figure.attn) {
  --panel-summary-signal: var(--warn);
}
.panel .summary:has(.figure.good):not(:has(.figure.attn)) {
  --panel-summary-signal: var(--live);
}
.panel .summary::before {
  content: "";
  position: absolute;
  top: -1px;
  right: var(--s4);
  left: var(--s4);
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    color-mix(in oklch, var(--panel-summary-signal) 82%, transparent) 18% 34%,
    transparent 62%
  );
}
.panel .summary::after {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(var(--panel-rail-reach) * -1);
  width: var(--panel-rail-reach);
  height: 1px;
  background: linear-gradient(
    90deg,
    color-mix(in oklch, var(--panel-summary-signal) 72%, var(--line-2)),
    var(--line-2)
  );
}
.panel .metric {
  position: relative;
  min-width: 0;
  min-height: 56px;
  padding: var(--s3) var(--s4);
  border: 0;
  border-left: 1px solid color-mix(in oklch, var(--line-2) 62%, transparent);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.panel .metric:first-child { border-left: 0; }
/* The corner bracket that used to sit on every metric is gone. Four little
   L-marks framing four numbers said nothing about the numbers — they were
   costume, and on a surface whose whole job is to be believed, ornament that
   imitates instrumentation costs trust it cannot repay. The dividing rules
   between metrics do the separating; the figures do the talking. */
.panel .metric .figure {
  text-shadow: 0 0 var(--s4) color-mix(in oklch, currentColor 20%, transparent);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
/* A reading that is zero, and that nobody needs to act on, steps back.
   It keeps its size — moving it would make the row twitch every time a count
   crossed one — and gives up contrast and glow instead, which is the part of
   emphasis that competes for the eye. The effect is that the aperture reads as
   the exceptions it contains: on a quiet board it is nearly blank, and a single
   non-zero is the only thing lit. */
.panel .metric.quiet .figure {
  color: var(--fg-3);
  text-shadow: none;
}
/* The LABEL is deliberately left alone.
   It was dimmed to 72% of --fg-3 to push the whole cell back, which measured
   3.03:1 in dark and 2.83:1 in light — below the 4.5:1 floor this project holds
   itself to, and dimmest on exactly the readings somebody with low vision would
   have to work hardest to find. The recession is already carried by the figure,
   which drops from the lit colour to --fg-3 and loses its glow; taking the word
   underneath below AA bought a little more contrast between cells at the cost of
   contrast against the background, which is the one that has to hold. */

/* The human's affordance sits in the context row because that row already says
   who is reading. Quiet while locked — it is an offer, not an alarm — and it
   takes the live colour once a person has proved they are here, which is the
   one state change on this surface that is genuinely about identity. */
.panel .human-lock {
  display: inline-flex; align-items: center; gap: var(--s2);
  margin-inline-start: auto;
  padding: var(--s1) var(--s3);
  border: 1px solid color-mix(in oklch, var(--line-2) 72%, transparent);
  border-radius: var(--r);
  background: transparent;
  color: var(--fg-2);
  font: inherit;
  font-size: var(--t-1);
  cursor: pointer;
}
.panel .human-lock:hover { color: var(--fg); border-color: var(--line-3); }
.panel .human-lock[data-state="unlocked"] {
  color: var(--live);
  border-color: color-mix(in oklch, var(--live) 46%, transparent);
}
.panel .human-lock[data-state="asking"] { color: var(--fg-2); cursor: wait; }
.panel .human-lock[data-state="unavailable"] { color: var(--fg-3); cursor: default; }

/* One composer shape for every human action, so the reader learns it once. */
.panel .human-compose {
  display: flex; flex-wrap: wrap; gap: var(--s2);
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid color-mix(in oklch, var(--line-2) 60%, transparent);
}
.panel .human-compose input {
  flex: 1 1 12rem; min-width: 0;
  padding: var(--s2) var(--s3);
  border: 1px solid color-mix(in oklch, var(--line-2) 72%, transparent);
  border-radius: var(--r);
  background: color-mix(in oklch, var(--bg) 97%, var(--bg-1));
  color: var(--fg); font: inherit; font-size: var(--t-1);
}
.panel .human-compose .act { flex: 0 0 auto; }
.panel .human-compose .join-note {
  flex: 1 1 auto; color: var(--fg-3); font-size: var(--t-1); align-self: center;
}

/* Work is drawn as a sequence of material records registered to the datum.
   The connector's hue is semantic and its shape is not: a dot and wire remain
   visible when colour is unavailable. The records themselves stay quiet and
   nearly flat, because the rail—not a pile of floating cards—is the identity. */
/* The card is gone, and this rule is what the comment above always claimed.
   A bordered, filled, bevelled, inset-shadowed rectangle around every record is
   the default component of every dashboard ever built; it added four kinds of
   chrome to say one thing the status bands overhead already say, and it cost
   real density — a lane with a single line of description occupied eighty
   vertical pixels, most of it padding around a box drawn to contain it.
   What survives is the part that carries meaning: the signal edge on the left,
   which is coloured by status and reaches back to the rail. Records now hang off
   that datum instead of floating beside it, so the eye follows one continuous
   spine down the board rather than counting containers. Density roughly halves,
   and nothing that was legible stops being legible. */
.panel :is(.entry, .channel, .msg) {
  position: relative;
  margin-block: 0;
  margin-inline: 0;
  padding: var(--s3) var(--s3) var(--s3) var(--s4);
  border: 0;
  border-left: 2px solid color-mix(
    in oklch,
    var(--panel-record-signal) 58%,
    transparent
  );
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  transition: border-color .18s var(--ease), background .18s var(--ease);
}
/* Hover fills rather than outlines: it marks the row under the pointer without
   introducing an edge that was not there a moment ago, which on a dense list
   reads as the layout shifting. */
.panel :is(.entry, .channel, .msg):hover {
  background: color-mix(in oklch, var(--fg) 3%, transparent);
  border-left-color: var(--panel-record-signal);
}
/* A hairline between records, owned by the one above, so the first row does not
   start with a rule hanging off nothing. */
.panel :is(.entry, .channel, .msg) + :is(.entry, .channel, .msg) {
  border-top: 1px solid color-mix(in oklch, var(--line-2) 34%, transparent);
}
.panel :is(.entry, .channel, .msg)::after {
  content: "";
  position: absolute;
  top: var(--s4);
  left: calc(var(--panel-rail-reach) * -1 - 2px);
  width: calc(var(--panel-rail-reach) + 2px);
  height: var(--s2);
  pointer-events: none;
  background:
    radial-gradient(
      circle at 2px 50%,
      var(--panel-record-signal) 0 2px,
      transparent 2px
    ),
    linear-gradient(
      90deg,
      var(--panel-record-signal),
      var(--line-2)
    ) 2px 50% / calc(100% - 2px) 1px no-repeat;
}
/* Three facts per record, and they were typeset as one.
 *
 * WHO this is (the name), WHAT it is doing right now (the declared slot), and
 * WHAT IT IS (the standing description) all sat within a hair of the same size
 * and colour, so the eye had nothing to climb and every row read as a paragraph.
 * They are not equally useful. The name is how you address it and the only
 * durable handle; the slot is the volatile line that decides whether you
 * intervene; the description is background you read once and then stop needing.
 *
 * So: the name gains weight and tightens, the slot keeps full contrast, and the
 * description gives up a step of size and colour. Nothing is removed. The rank
 * is now visible at a glance instead of having to be read for. */
.panel .entry .name {
  font-size: var(--t-body);
  font-weight: 600;
  letter-spacing: -.015em;
  color: var(--fg);
}
.panel .entry .about {
  margin-top: 2px;
  font-size: var(--t-1);
  line-height: 1.45;
  color: var(--fg-3);
}
.panel .entry .task { color: var(--fg); }

.panel .entry.active { --panel-record-signal: var(--live); }
.panel .entry.stale { --panel-record-signal: var(--warn); }

/* A lane losing touch, shown once, as the thing that actually happened.
 *
 * The marker's hairline reaches left toward the timeline: it is this agent's
 * line to the board. So when the agent stops answering, the line retracts to
 * the dot and comes back amber. The gesture is the event — a connection
 * withdrawing — rather than an ornament placed next to it, which is the only
 * kind of motion worth an operator's attention.
 *
 * Once, not forever. A perpetual pulse would keep spending attention long after
 * the information had been absorbed, and this board is read by somebody deciding
 * whether to intervene, not watched as a display. The steady amber marker is
 * what carries the state afterwards; the motion only carries the change. */
.panel .entry.went-quiet::after {
  transform-origin: 2px 50%;
  animation: panel-went-quiet 1.05s var(--ease) both;
}
@keyframes panel-went-quiet {
  0% { transform: scaleX(1); }
  38% { transform: scaleX(.06); }
  100% { transform: scaleX(1); }
}
.panel .entry.self { --panel-record-signal: var(--accent); }
.panel .channel.mine { --panel-record-signal: var(--accent); }
.panel .channel.exclusive { --panel-record-signal: var(--warn); }
.panel .msg[data-type="question"] { --panel-record-signal: var(--accent); }
.panel .msg[data-type="request"] { --panel-record-signal: var(--warn); }
.panel .msg[data-type="handoff"] { --panel-record-signal: var(--live); }
.panel .entry.self {
  border-color: color-mix(in oklch, var(--accent) 38%, var(--line));
  border-left-color: var(--accent);
  background: color-mix(in oklch, var(--bg) 96%, var(--bg-1));
}
.panel .entry.active .pip {
  box-shadow:
    0 0 0 var(--s1) color-mix(in oklch, var(--live) 9%, transparent),
    0 0 var(--s3) color-mix(in oklch, var(--live) 55%, transparent);
}
/* The band separates two groups; it does not need to be an intermission.
   Shared spacing gives it a top pad plus a panel margin on top of that, which
   read as a paragraph break on a wide web page and as dead air in a sidebar —
   a single-lane group could cost more vertical space in its gaps than in its
   content. Asymmetric now, deliberately: more room above than below, so the
   label binds to the records it introduces instead of floating between two
   groups belonging to neither. */
.panel .band {
  position: relative;
  margin-top: 0;
  padding-block: var(--s4) var(--s1);
}
.panel .band:first-child { padding-top: var(--s2); }
.panel .band::before {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(var(--panel-rail-reach) * -1);
  width: var(--panel-rail-reach);
  height: 1px;
  background: var(--line-2);
}
.panel .band.working::before { background: var(--live); }
.panel .band.gone::before { background: var(--warn); }
.panel .event {
  border-radius: calc(var(--r) * 1.2);
}

/* Liveness as an orbital instrument: dormant is an open, quiet aperture;
   attached is a closed field with a slow travelling charge. It says "the host
   is continuously present" without borrowing the visual language of loading. */
@property --panel-orbit {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
.panel .status-mark {
  position: relative;
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border: 1px solid color-mix(in oklch, var(--line-3) 66%, transparent);
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 50% 46%,
      color-mix(in oklch, var(--fg-2) 12%, transparent),
      transparent 54%
    ),
    color-mix(in oklch, var(--bg-1) 78%, transparent);
  box-shadow:
    inset 0 1px 0 color-mix(in oklch, var(--fg) 7%, transparent),
    inset 0 calc(var(--s1) * -1) var(--s3)
      color-mix(in oklch, var(--bg) 25%, transparent),
    0 var(--s2) var(--s4) color-mix(in oklch, var(--bg) 22%, transparent);
}
.panel .status-mark::before,
.panel .status-mark::after {
  content: "";
  position: absolute;
  border-radius: inherit;
  pointer-events: none;
}
.panel .status-mark::before {
  inset: 2px;
  padding: 1px;
  background: conic-gradient(
    from var(--panel-orbit),
    transparent 0 17%,
    color-mix(in oklch, var(--fg-3) 58%, transparent) 24%,
    transparent 31% 66%,
    color-mix(in oklch, var(--fg-3) 32%, transparent) 72%,
    transparent 79%
  );
  mask:
    linear-gradient(var(--fg) 0 0) content-box,
    linear-gradient(var(--fg) 0 0);
  mask-composite: exclude;
}
.panel .status-mark::after {
  inset: 8px;
  background: color-mix(in oklch, var(--fg-3) 36%, transparent);
  filter: blur(4px);
  opacity: .45;
}
.panel .status-mark svg {
  position: relative;
  z-index: 1;
  width: 16px;
  height: 16px;
}
.panel .status-mark.live {
  border-color: color-mix(in oklch, var(--live) 46%, var(--line));
  box-shadow:
    inset 0 1px 0 color-mix(in oklch, var(--fg) 9%, transparent),
    inset 0 calc(var(--s1) * -1) var(--s3)
      color-mix(in oklch, var(--bg) 24%, transparent),
    0 0 var(--s4) color-mix(in oklch, var(--live) 22%, transparent),
    0 var(--s2) var(--s5) color-mix(in oklch, var(--bg) 22%, transparent);
}
.panel .status-mark.live::before {
  background: conic-gradient(
    from var(--panel-orbit),
    transparent 0 12%,
    color-mix(in oklch, var(--live) 88%, transparent) 18%,
    transparent 26% 58%,
    color-mix(in oklch, var(--live) 44%, transparent) 65%,
    transparent 72%
  );
  animation: panel-orbit 9s linear infinite;
}
.panel .status-mark.live::after {
  background: var(--live);
  opacity: .72;
  animation: panel-core-breathe 3.6s var(--ease) infinite;
}
@keyframes panel-orbit { to { --panel-orbit: 1turn; } }
@keyframes panel-core-breathe {
  50% { opacity: .38; transform: scale(.72); }
}

/* Control density, in two numbers. */
.panel { --ctl-h: 34px; --ctl-pad: 6px 12px; }
.panel #pane-mail .act { position: relative; }
/* The operator's later `.compose` family is necessarily row-shaped. This
   composer is a reply card: textarea, keyboard hint, then actions. Keep that
   structure vertical, and restore the shared action tokens that
   `.compose .act` intentionally changes for the operator's inline rows. */
.panel #pane-mail .compose {
  display: block;
  padding: 0;
  border: 0;
}
.panel #pane-mail .compose .act {
  min-height: var(--ctl-h);
  padding: var(--ctl-pad);
  background: var(--bg-1);
  color: var(--fg-2);
  font-family: var(--sans);
  font-size: var(--t-sm);
  text-transform: none;
  letter-spacing: 0;
  transition:
    border-color .18s var(--ease),
    color .18s var(--ease),
    background .18s var(--ease),
    opacity .18s var(--ease);
}
.panel #pane-mail .act:disabled { cursor: wait; opacity: .62; }
.panel #pane-mail .act[aria-busy="true"] { padding-right: 30px; }
/* The busy spinner is genuinely panel-only: the operator board's actions are
   local and settle instantly, while the panel's cross the host bridge and can
   visibly take a moment. Kept here rather than pushed into the shared sheet —
   a design system should hold what is shared, not everything that exists. */
.panel .act-spin {
  position: absolute;
  top: 50%; right: 10px;
  width: 10px; height: 10px;
  margin-top: -5px;
  border: 1px solid var(--line-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: panel-spin .72s linear infinite;
}
@keyframes panel-spin { to { transform: rotate(360deg); } }
.panel #pane-mail .compose textarea:disabled { cursor: wait; opacity: .72; }
.panel .action-error {
  margin: var(--s2) 0 0;
  max-width: 74ch;
  font-family: var(--mono);
  font-size: var(--t-fine);
  color: var(--warn);
}
.panel .action-status {
  margin: var(--s2) 0 0;
  max-width: 74ch;
  font-family: var(--mono);
  font-size: var(--t-fine);
  color: var(--live);
}
.panel .action-status.stale { color: var(--warn); }

.panel main[aria-busy="true"] { cursor: progress; }

@media (pointer: coarse) {
  .panel .views button,
  .panel #pane-mail .act { min-height: 44px; }
}

/* The host owns the iframe width; components therefore answer to the panel,
   never to the browser viewport around it. The shared viewport fallback still
   makes an older engine usable, while these refinements follow the actual
   embedding container whenever size queries exist. */
@supports (container-type: inline-size) {
  @container lanes-panel (inline-size <= 42rem) {
    .panel {
      --panel-gutter: var(--s4);
    }
    .panel .sheet { padding: 0 var(--panel-gutter) var(--s6); }
    .panel .masthead > .views {
      margin-left: calc(var(--panel-rail-size) + var(--panel-rail-gap));
      width: calc(100% - var(--panel-rail-size) - var(--panel-rail-gap));
    }
    .panel .event {
      grid-template-columns: 50px 1fr;
      gap: 2px var(--s3);
    }
    .panel .event .e-when { grid-column: 2; }
    .panel :is(.entry .about, .task, .idents) { margin-left: 0; }
  }

  @container lanes-panel (inline-size <= 32rem) {
    .panel .views {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--s1);
    }
    .panel .views button {
      justify-content: center;
      min-width: 0;
      padding-right: var(--s1);
      padding-left: var(--s1);
    }
    .panel .views button::after {
      right: var(--s2);
      left: var(--s2);
    }
    .panel .summary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .panel .metric:nth-child(odd) { border-left: 0; }
    .panel .metric:nth-child(n + 3) {
      border-top: 1px solid color-mix(in oklch, var(--line-2) 62%, transparent);
    }
    .panel :is(.entry, .channel, .msg) {
      padding: var(--s3);
      border-radius: calc(var(--r) * 1.3);
    }
    .panel :is(.entry, .channel, .msg)::after {
      top: var(--s3);
    }
  }

  @container lanes-panel (inline-size <= 18rem) {
    .panel .views {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @container lanes-panel (inline-size > 48rem) {
    .panel .sheet {
      margin-block: var(--s4);
      border: 1px solid color-mix(in oklch, var(--line-2) 72%, transparent);
      border-radius: calc(var(--r) * 2.4);
      box-shadow:
        inset 0 1px 0 color-mix(in oklch, var(--fg) 5%, transparent),
        0 var(--s4) var(--s7) color-mix(in oklch, var(--bg) 28%, transparent);
    }
  }
}

@supports (field-sizing: content) {
  .panel #pane-mail .compose textarea {
    field-sizing: content;
    min-block-size: 4lh;
    max-block-size: 18lh;
  }
}

@supports (content-visibility: auto) {
  /* Keep the first scanful fully realized. Skipping every record made even a
     two-agent board eligible for off-screen suppression, which is neither a
     long-list optimization nor friendly to DOM-based assistive tooling. */
  .panel :is(.entry, .channel, .msg):nth-child(n + 7) {
    content-visibility: auto;
    contain-intrinsic-block-size: auto 7rem;
  }
  .panel .event:nth-child(n + 13) {
    content-visibility: auto;
    contain-intrinsic-block-size: auto 2.25rem;
  }
}

@supports (text-wrap: pretty) {
  .panel :is(.about, .channel-topic, .msg .body, .empty p) {
    text-wrap: pretty;
  }
  .panel :is(.empty h3, .firstrun h3) { text-wrap: balance; }
}

/* Named snapshots preserve each record's position while new records resolve
   out of the substrate. A tab change moves only the pane: the masthead and
   telemetry stay optically locked, which makes the navigation legible as a
   state change rather than a page reload. view-transition-class lets every
   dynamically named lane/message share one treatment. */
@supports (view-transition-name: none) {
  /* The pane switch itself is the shared sheet's (--> .view / board-view):
     it is the same movement on both surfaces and naming it twice is how one
     movement becomes two. Only the panel-specific records are named here. */
  .panel .view { view-transition-class: panel-pane; }
  .panel .metric:nth-child(1) .figure { view-transition-name: panel-metric-live; }
  .panel .metric:nth-child(2) .figure { view-transition-name: panel-metric-mail; }
  .panel .metric:nth-child(3) .figure { view-transition-name: panel-metric-work; }
  .panel .metric:nth-child(4) .figure { view-transition-name: panel-metric-stale; }
  .panel .metric .figure { view-transition-class: panel-metric; }

  html[data-transition="mail-arrival"]::view-transition-new(.panel-mail),
  html[data-transition="lane-arrival"]::view-transition-new(.panel-lane) {
    animation: panel-record-resolve .46s var(--ease) both;
  }
  html[data-transition="mail-arrival"]::view-transition-group(.panel-mail),
  html[data-transition="lane-arrival"]::view-transition-group(.panel-lane) {
    animation-duration: .46s;
    animation-timing-function: var(--ease);
  }
  ::view-transition-group(.panel-metric) {
    animation-duration: .3s;
    animation-timing-function: var(--ease);
  }

  /* A lane changing state TRAVELS to its new band.
   *
   * The rows are grouped by status, so a status change is also a change of
   * place: between two frames a lane leaves one group and reappears in another
   * a few hundred pixels away. Drawn without motion that reads as two unrelated
   * edits — a row disappeared here, a similar row appeared there — and the
   * reader has to reconstruct the one fact that mattered, which is that THIS
   * agent just changed state.
   *
   * Slower than the arrival treatment on purpose. An arrival can afford to be
   * quick because it has no history to preserve; this movement's entire job is
   * to stay followable across a long distance, and a fast travel over several
   * hundred pixels is a flicker with a direction. The counts in the aperture
   * and the band headers re-count during the same transition, so the number and
   * the row that caused it change together rather than in two steps.
   *
   * Every lane row carries a stable name, not just the movers, and that is the
   * right choice rather than an oversight. The rows below a departure really do
   * change place, and naming only the traveller would leave them to the root
   * cross-fade — they would blink to their new positions while one row glided
   * past, which reads as a rendering fault rather than a list resettling. Named
   * throughout, the group closes and the destination opens around a lane that
   * visibly moves between them: one event, drawn once. */
  html[data-transition="lane-band"]::view-transition-group(.panel-lane) {
    animation-duration: .62s;
    animation-timing-function: var(--ease);
  }
}

@keyframes panel-pane-out-left {
  to { opacity: 0; transform: translateX(-1rem) scale(.985); filter: blur(2px); }
}
@keyframes panel-pane-in-right {
  from { opacity: 0; transform: translateX(1.25rem) scale(.985); filter: blur(3px); }
}
@keyframes panel-pane-out-right {
  to { opacity: 0; transform: translateX(1rem) scale(.985); filter: blur(2px); }
}
@keyframes panel-pane-in-left {
  from { opacity: 0; transform: translateX(-1.25rem) scale(.985); filter: blur(3px); }
}
@keyframes panel-record-resolve {
  from {
    opacity: 0;
    transform: translateY(var(--s3)) scale(.985);
    filter: blur(4px);
    clip-path: inset(0 0 100% 0 round var(--r));
  }
}

@media (prefers-reduced-motion: reduce) {
  .panel .views .tally.bump,
  .panel .entry.went-quiet::after,
  .panel .act-spin,
  .panel .status-mark::before,
  .panel .status-mark::after { animation: none; }
  .panel .views button::after,
  .panel :is(.entry, .channel, .msg) { transition: none; }
  ::view-transition-group(*) { animation-duration: .001ms; }
}
</style>
</head>
<body class="panel">
<div class="surface" aria-hidden="true"></div>

<div class="sheet" id="app">
  <header class="masthead">
    <div class="mark">
      <span class="status-mark" id="mark" role="status" aria-label="Connecting to host" data-why="Connecting to host" tabindex="0">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke-width="1.1">
          <circle class="ring" cx="8" cy="8" r="6" stroke-dasharray="3 3.4" />
          <circle class="core" cx="8" cy="8" r="1.6" stroke="none" fill="currentColor" opacity=".45" />
        </svg>
      </span>
      <span class="wordmark">Lanes</span>
    </div>
    <nav class="views" role="tablist" aria-label="Lanes views">
      <button id="tab-board" data-view="board" role="tab" aria-controls="pane-board" aria-selected="true" tabindex="0">Board</button>
      <button id="tab-lanes" data-view="lanes" role="tab" aria-controls="pane-lanes" aria-selected="false" tabindex="-1">Lanes<span class="tally zero" id="tally-lanes" aria-hidden="true">0</span></button>
      <button id="tab-mail" data-view="mail" role="tab" aria-controls="pane-mail" aria-selected="false" tabindex="-1">Mail<span class="tally zero" id="tally-mail" aria-hidden="true">0</span></button>
      <button id="tab-activity" data-view="activity" role="tab" aria-controls="pane-activity" aria-selected="false" tabindex="-1">Activity<span class="tally zero" id="tally-act" aria-hidden="true">0</span></button>
    </nav>
  </header>
  <div class="hairline"></div>

  <div class="context" aria-label="Panel context">
    <span class="lane-id" id="ctx-lane">awaiting board</span>
    <span id="ctx-caps">—</span>
    <!-- The human's way in. Locked until a fingerprint proves somebody is
         actually here: the panel speaks with the AGENT's token, so without
         proof from outside the transport "this came from the operator" is a
         claim the one party it excludes could also make. -->
    <button id="human-lock" class="human-lock" type="button"
            aria-describedby="human-lock-why">
      <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <circle cx="8" cy="5" r="2.6" />
        <path d="M3.2 13.2a4.8 4.8 0 0 1 9.6 0" />
      </svg>
      <span id="human-lock-label">act as yourself</span>
    </button>
    <span class="sr-only" id="human-lock-why">Proves a person is at this machine
      with Touch ID, then lets you post, announce and message agents as
      yourself.</span>
  </div>

  <div class="summary" id="summary" role="status" aria-label="Board summary"></div>

  <main id="main">
    <section class="view" id="pane-board" role="tabpanel" aria-labelledby="tab-board" tabindex="0"></section>
    <section class="view hide" id="pane-lanes" role="tabpanel" aria-labelledby="tab-lanes" tabindex="0" hidden></section>
    <section class="view hide" id="pane-mail" role="tabpanel" aria-labelledby="tab-mail" tabindex="0" hidden></section>
    <section class="view hide" id="pane-activity" role="tabpanel" aria-labelledby="tab-activity" tabindex="0" hidden></section>
  </main>

  <footer class="foot" aria-label="Connection details">
    <span id="foot-node">—</span>
    <span class="dot">·</span>
    <span id="foot-host">unattached</span>
    <span class="dot">·</span>
    <!-- Which build of THIS FILE is on screen.
         Hosts cache the template by URI and one held a pre-fix panel across a
         daemon restart and every rebuild, so "is the fix even running?" could
         not be answered from a screenshot — and a screenshot was the only view
         anyone had. Now it can. Substituted server-side; see panelBuild. -->
    <span id="foot-build">panel /*__PANELBUILD__*/</span>
    <!-- Read this line first when the panel looks wrong. It is the build the
         SERVER produced, so if it disagrees with what `lanes` serves now, the
         host is rendering a template it cached and no server-side change can
         reach it until the client reconnects. -->
  </footer>
</div>

<p class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>

<script>/*__BOARDJS__*/</script>

<script>
// ── JSON-RPC over postMessage (MCP Apps 2026-01-26) ──────────
let nextId = 1
const pending = new Map()
let sizeObserver = null
let tornDown = false

addEventListener("message", (e) => {
  if (e.source !== parent) return
  const d = e.data
  if (!d || d.jsonrpc !== "2.0") return
  if (d.method === "ui/resource-teardown" && d.id !== undefined) {
    tornDown = true
    sizeObserver?.disconnect()
    sizeObserver = null
    // A guest cleans up after itself: the explainer owns a top-layer element
    // and document-level listeners, and neither goes away with our markup.
    closeExplainer?.()
    closeExplainer = null
    stopTicker?.()
    stopTicker = null
    for (const { reject, timer } of pending.values()) {
      clearTimeout(timer)
      reject(new Error("The host closed this panel"))
    }
    pending.clear()
    parent.postMessage({ jsonrpc: "2.0", id: d.id, result: {} }, "*")
    return
  }
  if (tornDown) return
  // A RESPONSE is the message with no `method`. Matching on id alone conflated
  // it with a host REQUEST, and the two id spaces collide by construction: ours
  // starts at 1 and the SDK host's counter starts at 0, so its second request
  // carries id 1 — the id we use for ui/initialize. A stray id-1 request settled
  // that handshake with `undefined`, so host.caps became {} and the panel
  // quietly decided it could not act.
  if (d.id !== undefined && d.method === undefined && pending.has(d.id)) {
    const { resolve, reject, timer } = pending.get(d.id)
    pending.delete(d.id)
    clearTimeout(timer)
    d.error ? reject(new Error(d.error.message || String(d.error))) : resolve(d.result)
    return
  }
  if (d.method === "ui/notifications/tool-result") render(d.params)
  if (d.method === "ui/notifications/host-context-changed") applyHostContext(d.params)
  if (d.method === "ui/notifications/tool-cancelled")
    announce(d.params?.reason ? `Tool cancelled: ${d.params.reason}` : "Tool cancelled")
})

function notify(method, params) {
  if (tornDown) return
  parent.postMessage({ jsonrpc: "2.0", method, params }, "*")
}

// Mark every call this panel makes through the bridge.
//
// The server duplicates ack_board's whole checkpoint into structuredContent
// because, on a host that drops _meta AND forbids an app from calling tools,
// that is the only carrier that can reach this panel at all. It costs the model
// a second copy of the board on every activation — and it is only necessary on
// that one kind of host.
//
// This panel is the only party that knows which kind it is running on, and it
// finds out by succeeding: a call that arrives at the daemon proves the host
// permits app→tool calls, which means the panel can fetch for itself and the
// duplicate is dead weight. So say so, in _meta, where it costs the model
// nothing. The server stops duplicating for this session from then on.
const PANEL_CALL_META = "com.lanes/panel-call"

function call(method, params) {
  if (tornDown) return Promise.reject(new Error("The host closed this panel"))
  if (method === "tools/call" && params && typeof params === "object") {
    params = { ...params, _meta: { ...(params._meta || {}), [PANEL_CALL_META]: true } }
  }
  const id = nextId++
  return new Promise((res, rej) => {
    const timer = setTimeout(() => {
      if (pending.delete(id)) rej(new Error("Timed out while waiting for the host"))
    }, 6000)
    pending.set(id, { resolve: res, reject: rej, timer })
    parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*")
  })
}

// Mirrors the SDK's measurement: force max-content so the true document height
// is read rather than whatever the current box happens to be, then restore.
// THE reason a container renders empty is that the host sizes the iframe from
// what the app reports; send nothing and you get zero height.
function reportSize() {
  if (tornDown) return
  const el = document.documentElement
  const prev = el.style.height
  el.style.height = "max-content"
  const height = Math.ceil(el.getBoundingClientRect().height)
  el.style.height = prev
  notify("ui/notifications/size-changed", { width: Math.ceil(innerWidth), height })
}

function startSizeReporting() {
  sizeObserver?.disconnect()
  let queued = false
  const schedule = () => {
    if (queued) return
    queued = true
    requestAnimationFrame(() => { queued = false; reportSize() })
  }
  schedule()
  sizeObserver = new ResizeObserver(schedule)
  sizeObserver.observe(document.documentElement)
  sizeObserver.observe(document.body)
}

// ── helpers ──────────────────────────────────────────────────
// Rendering lives in the shared component library (internal/assets/board.js),
// inlined above. Only what is specific to being an MCP App stays here: the
// transport, the handshake, the host capabilities, and who may act.
const { esc } = Board

let state = {
  board: null,
  inbox: [],
  events: [],
  lane: null,
  token: null,
  composing: null,
  pending: new Map(),
  errors: new Map(),
  settled: new Map(),
  rendered: new Map(),
  received: false,
  // Set once every carrier has been tried and none produced a board, so the
  // panel can stop claiming one is on the way. Cleared the moment one arrives.
  // Why the board never arrived, and what the reader can do about it. A bare
  // boolean produced a 10px "no board from this host" beside four confident
  // zeros and "No lanes yet" — over a live five-lane fleet. The panel KNEW which
  // carrier failed and threw the answer away.
  unreachable: null,
}

// What the host is willing to let this panel do. Learned at handshake.
//   serverTools        — the panel may call Lanes itself
//   updateModelContext — the panel may put content into the agent's context
let host = {
  caps: {}, ctx: {}, name: "", version: "", proto: "",
  shared: "", sharing: "",
}
const canShareContext = () => !!host.caps.updateModelContext
const canCallTools = () => !!host.caps.serverTools

// View transitions are an explanation layer, never a dependency. Reduced
// motion bypasses snapshotting entirely (rather than asking CSS to make an
// unnecessary transition instantaneous), and a live transition never queues
// another one behind it — board pushes are facts, not an animation playlist.
let closeExplainer = null
let stopTicker = null
// Delegates to the shared runner (Board.transition): the guard, the feature
// check and the data-transition contract are the same product decision on both
// surfaces, and keeping a second copy here is how they stop being the same.
const runPanelTransition = (kind, update) => Board.transition(kind, update)

// Dynamic records need stable, valid custom identifiers so the browser can
// move an existing lane/message from its old geometry to its new one. Encoding
// code points instead of using the raw id also handles spaces and non-ASCII
// display names without relying on CSS.escape support.
function transitionIdent(kind, value) {
  const encoded = [...String(value)].map(
    (char) => char.codePointAt(0).toString(36)).join("-")
  return `panel-${kind}-${encoded || "empty"}`
}

function nameTransition(node, kind, value, family) {
  if (!node || !CSS.supports("view-transition-name", "none")) return
  node.style.viewTransitionName = transitionIdent(kind, value)
  node.style.setProperty("view-transition-class", family)
}

function announce(text) {
  const el = document.getElementById("announcer")
  if (!el) return
  el.textContent = ""
  requestAnimationFrame(() => { el.textContent = text })
}

// Host styles make the panel belong inside its container without erasing the
// product's semantic palette. Neutral trios are applied only as complete sets;
// the Apps spec permits partial variables, and mixing one host surface with two
// Lanes surfaces is worse than using the coherent fallback.
function applyHostStyles(styles) {
  const vars = styles?.variables || {}
  const root = document.documentElement
  const fonts = styles?.css?.fonts
  let hostFonts = document.getElementById("mcp-host-fonts")
  if (typeof fonts === "string") {
    if (!hostFonts) {
      hostFonts = document.createElement("style")
      hostFonts.id = "mcp-host-fonts"
      document.head.appendChild(hostFonts)
    }
    if (hostFonts.textContent !== fonts) hostFonts.textContent = fonts
  }
  for (const [name, value] of Object.entries(vars)) {
    if (typeof value === "string" && name.startsWith("--"))
      root.style.setProperty(name, value)
  }

  const groups = [
    [
      ["--color-background-primary", "--bg"],
      ["--color-background-secondary", "--bg-1"],
      ["--color-background-tertiary", "--bg-2"],
    ],
    [
      ["--color-text-primary", "--fg"],
      ["--color-text-secondary", "--fg-2"],
      ["--color-text-tertiary", "--fg-3"],
    ],
    [
      ["--color-border-primary", "--line"],
      ["--color-border-secondary", "--line-2"],
      ["--color-border-tertiary", "--line-3"],
    ],
  ]
  for (const group of groups) {
    if (group.every(([source]) => typeof vars[source] === "string"))
      for (const [source, target] of group) root.style.setProperty(target, `var(${source})`)
  }

  const singles = [
    ["--font-sans", "--sans"],
    ["--font-mono", "--mono"],
    ["--border-radius-sm", "--r"],
    ["--color-ring-primary", "--focus"],
    ["--color-text-success", "--live"],
    ["--color-text-warning", "--warn"],
  ]
  for (const [source, target] of singles)
    if (typeof vars[source] === "string") root.style.setProperty(target, `var(${source})`)
}

function applyHostContext(patch = {}) {
  const oldStyles = host.ctx.styles || {}
  const nextStyles = patch.styles || {}
  host.ctx = {
    ...host.ctx,
    ...patch,
    styles: {
      ...oldStyles,
      ...nextStyles,
      variables: { ...(oldStyles.variables || {}), ...(nextStyles.variables || {}) },
    },
  }

  const theme = host.ctx.theme
  if (theme === "light" || theme === "dark") {
    document.documentElement.setAttribute("data-theme", theme)
    // The attribute selects Lanes' palette; color-scheme also reaches native
    // controls and scrollbars. Without both, a light host on a dark OS gets a
    // light panel with dark browser chrome inside it.
    document.documentElement.style.colorScheme = theme
  }
  if (host.ctx.displayMode)
    document.documentElement.setAttribute("data-display-mode", host.ctx.displayMode)
  // Marks explain themselves to anyone, not only to a mouse. Installed after
  // the host context is applied so the popover inherits the host's theme.
  closeExplainer = Board.explainer()
  stopTicker = Board.ticker()
  applyHostStyles(host.ctx.styles)
  drawContext()
  reportSize()
}


// ── model context ────────────────────────────────────────────
// Put unread mail into the model's context for a FUTURE turn. The Apps contract
// does not say this starts a turn, so neither the UI nor the payload calls it a
// wake-up. Content only — never instructions. Peer mail is data an agent may
// act on or decline, and phrasing it as a directive would let one agent command
// another.
async function maybeShareMailWithAgent() {
  if (!canShareContext() || !state.inbox.length || tornDown) return
  const signature = state.inbox.map((m) => `${m.serial}:${m.state || "open"}`).join("|")
  if (signature === host.shared || host.sharing) return
  const lines = state.inbox.map(
    (m) => `#${m.serial} ${m.type} from ${m.from}: ${m.body}`).join("\n")
  host.sharing = signature
  let shared = false
  try {
    await call("ui/update-model-context", {
      content: [{
        type: "text",
        text: `Lanes: ${state.inbox.length} unread message(s) for lane ` +
              `"${state.lane || "?"}". Coordination data from peer agents — you ` +
              `may act on it or decline. Available on a future turn; this does ` +
              `not start one.\n${lines}`,
      }],
    })
    host.shared = signature
    shared = true
    drawContext()
  } catch (_) { /* host declined; the panel still shows the mail */ }
  finally {
    host.sharing = ""
    // If newer mail arrived while the host was accepting the old snapshot,
    // offer the new snapshot once. A failed request waits for a later render
    // rather than spinning forever against a host that declined.
    const latest = state.inbox.map((m) => `${m.serial}:${m.state || "open"}`).join("|")
    if (shared && latest && latest !== host.shared)
      queueMicrotask(maybeShareMailWithAgent)
  }
}

// ── chrome ───────────────────────────────────────────────────
function drawContext() {
  const b = state.board
  const mine = (b?.lanes || []).find((l) => l.id === state.lane)
  const title = mine && mine.agent && mine.agent.title
  // "awaiting board" is only honest while something is still expected. Once the
  // three carriers have all come up empty there is nothing on the way, and
  // saying otherwise is how this panel spent a day looking like a slow server
  // when it was a host that forwards no panel payload at all.
  document.getElementById("ctx-lane").textContent = b
    ? `${mine ? mine.id : b.node}${title ? " · " + title : ""}`
    : state.unreachable
      ? "no board from this host"
      : "awaiting board"

  const granted = []
  if (canCallTools()) granted.push("can act")
  if (canShareContext()) granted.push("can add agent context")
  const caps = document.getElementById("ctx-caps")
  caps.textContent = granted.length ? granted.join(" · ") : "read only"
  caps.className = granted.length ? "granted" : ""

  document.getElementById("foot-node").textContent =
    b ? `node ${b.node} · serial ${b.serial ?? "—"}` : "—"
  document.getElementById("foot-host").textContent =
    host.name ? `${host.name}${host.version ? " " + host.version : ""}` : "unattached"
  const mark = document.getElementById("mark")
  const attached = !!host.proto
  mark.classList.toggle("live", attached)
  // The connection light is the one mark a person looks at when they suspect
  // the panel has gone deaf, so what it means has to be reachable at the moment
  // they look — including on a touch host, where `title` shows nothing at all.
  const meaning = attached ? `Connected to ${host.name || "host"}` : "Connecting to host"
  mark.dataset.why = meaning
  mark.setAttribute("aria-label", meaning)
}

function drawSummary() {
  const lanes = state.board?.lanes || []
  const live = lanes.filter((l) => l.status === "active").length
  const stale = lanes.filter((l) => l.status === "stale").length
  const working = lanes.filter((l) => (l.slots || []).length > 0).length
  const unread = state.inbox.length

  const summary = document.getElementById("summary")
  patchHTML(summary, Board.summaryHTML([
    { figure: `${live}<span class="of">/${lanes.length}</span>`, label: "live", tone: live ? "good" : "" },
    { figure: String(unread), label: "unanswered", tone: unread ? "attn" : "" },
    { figure: String(working), label: "declared" },
    { figure: String(stale), label: "out of touch", tone: stale ? "attn" : "" },
  ]))
  const label = `${live} of ${lanes.length} live. ${unread} unanswered. ` +
    `${working} declared. ${stale} out of touch.`
  if (summary.getAttribute("aria-label") !== label)
    summary.setAttribute("aria-label", label)
  document.title = unread ? `Lanes — ${unread} waiting` : "Lanes — Board"
}

// ── actions ──────────────────────────────────────────────────
// The one genuinely panel-specific piece of rendering, and the reason the
// shared components take an `actionsHTML` callback rather than deciding for
// themselves: only this surface holds a lane token and may answer AS that lane.
// The web board watches the same messages and can do none of it.
//
// What the human can DO about this message, right here.
//
// A panel that shows you mail you must then go and type instructions about is a
// picture of a problem. Where the host grants serverTools, the panel can answer
// as the lane it belongs to.
function actionsHTML(m) {
  if (!canCallTools() || !state.token) return ""
  const s = esc(m.serial)
  const settled = state.settled.get(m.serial)
  if (settled) {
    const stale = settled.refreshError
    const text = stale
      ? `${actionName(settled.action)} sent, but mail could not refresh. ` +
        `Wait for an update before retrying. ${settled.refreshError}`
      : `${actionName(settled.action)} sent. Refreshing mail…`
    return `<p class="action-status${stale ? " stale" : ""}" role="status">${esc(text)}</p>`
  }
  if (Board.TERMINAL.has(m.state)) return ""
  const pendingAction = state.pending.get(m.serial)
  const error = state.errors.get(m.serial)
  const btn = (act, label, cls) => {
    const active = pendingAction?.action === act ||
      (pendingAction?.action === "answer" && act === "send")
    const described = error ? ` aria-describedby="action-error-${s}"` : ""
    return `<button class="act ${cls}" data-serial="${s}" data-act="${act}"${
      pendingAction ? " disabled" : ""}${active ? ' aria-busy="true"' : ""}${described}>` +
      `<span>${label}</span>${active ? '<span class="act-spin" aria-hidden="true"></span>' : ""}</button>`
  }
  const errorHTML = error
    ? `<p class="action-error" id="action-error-${s}" role="alert">${esc(error)}</p>`
    : ""

  if (state.composing === m.serial)
    return `
      <div class="compose">
        <label class="sr-only" for="reply-${s}">Answer message #${s}</label>
        <textarea id="reply-${s}" rows="3" maxlength="4000" placeholder="Your answer"${
          pendingAction ? " disabled" : ""}></textarea>
        <div class="hint"><kbd>⌘</kbd>+<kbd>↵</kbd> to send · <kbd>esc</kbd> to cancel</div>
        <div class="acts">${btn("send", "Send reply", "primary")}${btn("cancel", "Cancel", "")}</div>
        ${errorHTML}
      </div>`

  if (m.type === "question")
    return `<div class="acts">${btn("compose", "Answer", "primary")}${btn("decline", "Decline", "")}</div>${errorHTML}`
  if (m.type === "request")
    return `<div class="acts">${btn("approve", "Approve", "ok")}${btn("deny", "Deny", "no")}</div>${errorHTML}`
  return `<div class="acts">${btn("ack", "Acknowledge", "")}</div>${errorHTML}`
}

// A Lanes refusal is a successful JSON-RPC exchange carrying an MCP `isError`
// result. Treating only rejected promises as failures announces a refused
// action as sent. Keep the engine's honest hint intact.
function toolFailure(result) {
  if (!result?.isError) return ""
  const raw = result.content?.find((c) => c?.type === "text")?.text || ""
  try {
    const detail = JSON.parse(raw)
    const reason = detail.message || detail.error || "Lanes refused this action."
    return detail.hint ? `${reason} ${detail.hint}` : reason
  } catch (_) {
    return raw || "Lanes refused this action."
  }
}

function toolJSON(result) {
  const raw = result?.content?.find((c) => c?.type === "text")?.text
  if (typeof raw !== "string") return null
  try { return JSON.parse(raw) } catch (_) { return null }
}

// Board and mailbox state out of an ordinary tool result's content.
//
// Only the shapes the panel draws, and only when they are actually there: a
// summary line parses to nothing, `show_board` without detail carries no board,
// and neither should overwrite what the panel already has. Returns null rather
// than an empty object so the caller can tell "nothing in content" from
// "content said the mailbox is empty", which are different facts.
function contentState(params) {
  const plain = toolJSON(params)
  if (!plain || typeof plain !== "object") return null
  const out = {}
  if (plain.board && typeof plain.board === "object") out.board = plain.board
  // inbox nests under "inbox" from ack_board and sits at the top level from
  // inbox itself — the same two shapes panelState normalises server-side.
  if (plain.inbox) out.inbox = plain.inbox
  else if (Array.isArray(plain.messages)) out.inbox = { messages: plain.messages }
  if (Array.isArray(plain.events)) out.events = plain.events
  return Object.keys(out).length ? out : null
}

// Fetch the board ourselves when the host handed us only a bootstrap.
//
// The server sends panel data in tool-result _meta, which is where the spec puts
// it and which keeps the board out of model context — the whole reason
// show_board can honestly cost one summary line. Not every host forwards it. On
// one that does not, this panel receives a tool-result carrying a token and no
// board, and used to sit on "awaiting board · No lanes yet" indefinitely while
// the daemon held a full board. It looked exactly like a server bug.
//
// The repair is to stop waiting and ask. A tool call we make over our own bridge
// never enters model context whatever the host does with _meta, so the board
// arrives at the same price it was always supposed to cost: nothing. We prefer
// _meta on the reply too, and fall back to the ordinary content JSON, which is
// the one field every host forwards.
let boardFetch = null
// unreachable records WHY no board arrived, and what to do instead.
//
// Only when the panel genuinely has nothing: a board already on screen is not
// replaced by an explanation of a failed refresh.
function unreachable(reason, action) {
  if (state.board) return
  state.unreachable = { reason, action }
  draw()
}

function fetchBoard() {
  if (boardFetch || tornDown) return
  // No token, or a host that will not proxy a tool call, means there is no
  // third carrier — say so now rather than after a timeout that never resolves.
  // Two different failures, and they were one flag. Telling somebody their host
  // will not proxy tool calls when the real problem is a missing token sends
  // them to the wrong place.
  if (!state.token) {
    unreachable("This host forwarded no panel payload, so the panel has no token to read the board with.",
      "Run `lanes board` in a terminal to see the fleet.")
    return
  }
  if (!canCallTools()) {
    unreachable("This host does not let panels call tools, and it forwarded no board.",
      "Run `lanes board` in a terminal to see the fleet.")
    return
  }
  boardFetch = (async () => {
    try {
      const res = await call("tools/call", {
        name: "show_board",
        arguments: { token: state.token, detail: true },
      })
      if (toolFailure(res)) return
      const payload = res?._meta?.["com.lanes/panel"] || toolJSON(res)
      // Guard against re-entry: render() calls back here when a push carries no
      // board, so handing it another boardless payload would spin.
      if (payload && (payload.board || payload.inbox)) render({ structuredContent: payload })
      else unreachable("Lanes answered, but this host delivered no board with it.",
        "Run `lanes doctor` — it names what is quietly broken.")
    } catch (err) {
      // The fetch is the last of three carriers, so its failure ends the line —
      // say so rather than leaving "awaiting board" up forever. The next tool
      // result still tries again, and a success clears this. The reason is the
      // host's own words: a bare catch threw away the one sentence that could
      // tell a stalled panel from a broken daemon.
      unreachable(err instanceof Error ? err.message : "The host did not answer.",
        "Run `lanes doctor` — it names what is quietly broken.")
    } finally {
      boardFetch = null
    }
  })()
}

// Run a Lanes tool through the host proxy, as this lane.
async function act(serial, disposition) {
  if (state.pending.has(serial)) return
  if (disposition === "compose") {
    state.errors.delete(serial)
    state.composing = serial
    draw()
    focusReply(serial)
    return
  }
  if (disposition === "cancel") {
    state.errors.delete(serial)
    state.composing = null
    draw()
    focusAction(serial, "compose")
    return
  }

  let body = ""
  const wasComposing = state.composing === serial
  if (disposition === "send") {
    const box = document.getElementById("reply-" + serial)
    body = (box && box.value.trim()) || ""
    if (!body) {
      state.errors.set(serial, "Write an answer before sending.")
      draw()
      focusReply(serial)
      return
    }
    disposition = "answer"
  }
  if (!state.token) return

  state.errors.delete(serial)
  state.pending.set(serial, { action: disposition, body })
  draw()
  announce(`Sending ${actionName(disposition)} for message ${serial}`)

  let result
  try {
    if (disposition === "ack") {
      result = await call("tools/call", {
        name: "ack_message", arguments: { token: state.token, msg_serial: serial } })
    } else {
      result = await call("tools/call", { name: "respond",
        arguments: { token: state.token, msg_serial: serial, disposition, body } })
    }
  } catch (err) {
    state.pending.delete(serial)
    state.errors.set(serial,
      "Delivery could not be confirmed. Check Lanes before retrying. " +
      (err instanceof Error ? err.message : "The host did not complete the action."))
    draw()
    announce(`Delivery not confirmed for ${actionName(disposition)} on message ${serial}`)
    if (wasComposing) focusReply(serial)
    else focusAction(serial, disposition)
    return
  }

  const refusal = toolFailure(result)
  if (refusal) {
    state.pending.delete(serial)
    state.errors.set(serial, `Lanes refused this action; nothing changed. ${refusal}`)
    draw()
    announce(`Lanes refused ${actionName(disposition)} for message ${serial}`)
    if (wasComposing) focusReply(serial)
    else focusAction(serial, disposition)
    return
  }

  // The mutation is now confirmed. From this point on a refresh failure must
  // never be described as a send failure: retrying could duplicate the action.
  //
  // Remember who was next, so the keyboard has somewhere to land once this
  // message leaves the DOM. Taken BEFORE the redraw, because afterwards the
  // neighbour is the only evidence left of where the reader was.
  const order = state.inbox.map((m) => m.serial)
  const gone = order.indexOf(serial)
  const landOn = gone >= 0 ? (order[gone + 1] ?? order[gone - 1]) : undefined
  state.pending.delete(serial)
  if (wasComposing) state.composing = null
  state.errors.delete(serial)
  state.settled.set(serial, { action: disposition, body, refreshError: false })
  draw()
  announce(`${actionName(disposition)} sent for message ${serial}`)

  try {
    const refreshed = await call(
      "tools/call", { name: "inbox", arguments: { token: state.token } })
    const refreshRefusal = toolFailure(refreshed)
    if (refreshRefusal) throw new Error(refreshRefusal)
    const panelInbox = refreshed?._meta?.["com.lanes/panel"]
      || refreshed?.structuredContent
    if (panelInbox && Object.prototype.hasOwnProperty.call(panelInbox, "inbox")) {
      render({ structuredContent: panelInbox })
    } else {
      // The trimmed panel payload omits an empty inbox (and some hosts omit the
      // UI payload entirely): showing a second panel merely to say "nothing
      // waiting" would be noise. This already-open panel still needs the empty
      // state, which remains available in the ordinary tool content.
      const plain = toolJSON(refreshed)
      const hasMessages = plain &&
        Object.prototype.hasOwnProperty.call(plain, "messages")
      if (!hasMessages || (plain.messages != null && !Array.isArray(plain.messages)))
        throw new Error("The host returned no mailbox state")
      render({ structuredContent: { inbox: { messages: plain.messages || [] } } })
    }
    state.settled.delete(serial)
    draw()
    landFocus(landOn)
  } catch (err) {
    const settled = state.settled.get(serial)
    if (settled) {
      settled.refreshError = err instanceof Error
        ? err.message
        : "The host did not return mailbox state."
    }
    draw()
    announce(`${actionName(disposition)} sent; mailbox refresh failed`)
  }
}

function actionName(action) {
  return ({
    answer: "answer",
    approve: "approval",
    deny: "denial",
    decline: "decline",
    ack: "acknowledgement",
  })[action] || action
}

function focusAction(serial, action) {
  const fallback = document.querySelector(`.act[data-serial="${serial}"]`)
  const exact = document.querySelector(`.act[data-serial="${serial}"][data-act="${action}"]`)
  ;(exact || fallback)?.focus()
}

// Keyboard is the point of an inline composer: a reply you have to reach for
// the mouse to send is barely better than the dialog it replaced.
// armReply binds the keyboard path to whichever textarea exists RIGHT NOW.
//
// It has to be re-run after every redraw. The handler is an element property,
// and draw() replaces the mail pane with innerHTML — so the new textarea has no
// handler at all, and ⌘+↵ silently stops working while the panel goes on
// printing "⌘+↵ to send" underneath it. Nothing errors; the key just does
// nothing, which is the worst way for a shortcut to fail.
function armReply(serial) {
  const box = document.getElementById("reply-" + serial)
  if (!box) return null
  box.onkeydown = (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); act(serial, "send") }
    if (e.key === "Escape") { e.preventDefault(); act(serial, "cancel") }
  }
  return box
}

function focusReply(serial) {
  const box = armReply(serial)
  if (!box) return
  box.focus()
  box.setSelectionRange(box.value.length, box.value.length)
}

function patchHTML(el, html) {
  if (state.rendered.get(el.id) === html) return false
  state.rendered.set(el.id, html)
  el.innerHTML = html
  return true
}

// landFocus puts the keyboard on the message that took the place of the one
// just acted on, after the last redraw.
//
// Not the settled notice: it does not live long enough to be a landing site. Not
// the composer either — the reader has finished, not started. The neighbour is
// where their eye already is.
function landFocus(serial) {
  if (serial === undefined) return
  const next = document.querySelector(`.msg[data-serial="${serial}"]`)
  if (next) next.focus({ preventScroll: false })
}

// ── the human at the board ───────────────────────────────────────────────
//
// The panel speaks with the AGENT's token, and the transport cannot tell "a
// person clicked this" from "the agent called the tool" — same connection, same
// credential. So the proof comes from outside it: human_unlock raises a Touch ID
// sheet on this machine, and what it hands back is the human's OWN agent
// identity, not a privileged capability. Everything below then sends the same
// ops an agent sends. Nothing here is a second authorization path.
async function unlockHuman() {
  if (state.humanState === "asking" || state.human) return
  setHumanState("asking")
  try {
    const res = await call("tools/call", {
      name: "human_unlock",
      arguments: { token: state.token, note: "act on the Lanes board as yourself" },
    })
    const refusal = toolFailure(res)
    if (refusal) { setHumanState("locked"); announce(refusal); return }
    const out = toolJSON(res) || {}
    if (out.unlocked && out.token) {
      state.human = { agent: out.agent, token: out.token }
      setHumanState("unlocked")
      announce(`you are on the board as ${out.agent}`)
      draw()
      return
    }
    // Declining is an answer, not a fault: no red, no retry loop.
    setHumanState(out.reason === "unavailable" ? "unavailable" : "locked")
    if (out.hint) announce(out.hint)
  } catch (err) {
    setHumanState("locked")
    announce(err instanceof Error ? err.message : "the host did not answer")
  }
}

function setHumanState(next) {
  state.humanState = next
  const btn = document.getElementById("human-lock")
  if (!btn) return
  btn.dataset.state = next
  btn.disabled = next === "asking" || next === "unavailable"
  const label = document.getElementById("human-lock-label")
  if (label) {
    label.textContent = {
      locked: "act as yourself",
      asking: "confirming…",
      unlocked: state.human ? state.human.agent : "you",
      unavailable: "no sensor here",
    }[next]
  }
}

// humanAct sends one ordinary tool call as the human, and says what happened.
async function humanAct(name, args, said) {
  if (!state.human) return
  try {
    const res = await call("tools/call", {
      name, arguments: { ...args, token: state.human.token },
    })
    const refusal = toolFailure(res)
    // A Lanes refusal is a successful exchange carrying isError — reporting it
    // as sent is the failure this panel already guards against elsewhere.
    announce(refusal || said)
    if (!refusal) await refreshBoard()
  } catch (err) {
    announce(err instanceof Error ? err.message : "the host did not answer")
  }
}

// refreshBoard re-reads the board after the human changes it, so the surface
// they just acted on shows the result rather than the state before it.
async function refreshBoard() {
  try {
    const res = await call("tools/call", {
      name: "show_board", arguments: { token: state.token, detail: true },
    })
    if (toolFailure(res)) return
    const payload = res?._meta?.["com.lanes/panel"] || toolJSON(res)
    if (payload && (payload.board || payload.inbox)) render({ structuredContent: payload })
  } catch (_) { /* the next push will carry it */ }
}

// composerHTML is one shape for every human action, so the reader learns it once.
function composerHTML(kind, target, placeholder, actions) {
  const id = `hc-${kind}-${target}`.replace(/[^a-zA-Z0-9-]/g, "_")
  return `<div class="human-compose" data-kind="${kind}" data-target="${escapeAttr(target)}">
    <input type="text" id="${id}" placeholder="${escapeAttr(placeholder)}"
           aria-label="${escapeAttr(placeholder)}">
    ${actions.map((a) =>
      `<button class="act" type="button" data-do="${a.do}" data-for="${id}">${a.label}</button>`
    ).join("")}
  </div>`
}

function escapeAttr(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])
}

// wireHumanComposers binds every composer the last draw produced. Bound after
// the redraw rather than delegated, matching how the reply actions are wired.
function wireHumanComposers(root) {
  for (const btn of root.querySelectorAll(".human-compose .act")) {
    btn.onclick = () => {
      const field = document.getElementById(btn.dataset.for)
      const box = btn.closest(".human-compose")
      const body = (field?.value || "").trim()
      // join takes no text; everything else refuses to send an empty message
      // rather than posting a blank one, which reads on the board as noise.
      if (btn.dataset.do !== "join" && !body) { field?.focus(); return }
      const target = box.dataset.target
      const verb = btn.dataset.do
      field.value = ""
      if (verb === "post") {
        void humanAct("lane_post", { lane: target, body }, `posted to ${target}`)
      } else if (verb === "announce") {
        void humanAct("lane_announce", { lane: target, body },
          `announced to ${target} — every member must acknowledge`)
      } else if (verb === "notify") {
        void humanAct("send_message", { to: target, type: "notify", body },
          `sent to ${target}`)
      } else if (verb === "join") {
        void humanAct("lane_join", { lane: target }, `joined ${target}`)
      } else if (verb === "ask") {
        void humanAct("send_message", { to: target, type: "question", body, deadline_s: 3600 },
          `asked ${target}`)
      }
    }
  }
}

function decorateMail(el) {
  const messages = [...el.querySelectorAll(".msg")]
  messages.forEach((node, index) => {
    const m = state.inbox[index]
    if (!m) return
    // Landable, never tabbable. After an action the message it belonged to is
    // gone from the DOM, so focus fell to <body> and a keyboard reader was
    // returned to the top of the panel — only the FAILURE paths put focus back.
    // A shared .msg class means this must live here and not in board.js: the web
    // board renders the same class and has no actions to land on.
    node.tabIndex = -1
    node.dataset.serial = String(m.serial ?? "")
    node.dataset.type = m.type || "notify"
    node.setAttribute("aria-label",
      `${m.type || "notification"} from ${m.from || "unknown sender"}: ${m.body || ""}`)
    if (state.pending.has(m.serial)) node.setAttribute("aria-busy", "true")
    else node.removeAttribute("aria-busy")
    nameTransition(node, "mail", m.serial, "panel-mail")
  })
  document.getElementById("main").setAttribute(
    "aria-busy", String(state.pending.size > 0))
}

function decorateRoster(el) {
  const lanes = state.board?.lanes || []
  const ordered = [
    ...lanes.filter((lane) => lane.status === "stale"),
    ...lanes.filter((lane) => lane.status === "active"),
    ...lanes.filter((lane) => lane.status === "dormant"),
    ...lanes.filter((lane) =>
      !["active", "dormant", "stale"].includes(lane.status)),
  ]
  ;[...el.querySelectorAll(".entry")].forEach((node, index) => {
    const lane = ordered[index]
    if (!lane) return
    node.dataset.lane = lane.id || ""
    nameTransition(node, "lane", lane.id, "panel-lane")
  })
}

function decorateChannels(el) {
  ;[...el.querySelectorAll(".channel")].forEach((node, index) => {
    const channel = (state.board?.channels || [])[index]
    if (!channel) return
    node.dataset.channel = channel.id || ""
    nameTransition(node, "channel", channel.id, "panel-lane")
  })
}

function decorateEvents(el) {
  ;[...el.querySelectorAll(".event")].forEach((node, index) => {
    const event = state.events[index]
    if (!event) return
    nameTransition(node, "event", event.serial ?? index, "panel-event")
  })
}


// ── draw ─────────────────────────────────────────────────────
function draw() {
  drawContext()
  drawSummary()

  const opts = { selfId: state.lane, actionsHTML }

  const boardEl = document.getElementById("pane-board")
  patchHTML(boardEl, Board.rosterHTML(state.board?.lanes, {
    selfId: state.lane,
    events: state.events,
    empty: Board.emptyHTML("No lanes yet",
      "Agents appear here the moment they register."),
  }))
  decorateRoster(boardEl)
  if (state.human) {
    for (const node of boardEl.querySelectorAll(".entry")) {
      const who = node.dataset.lane
      if (!who || who === state.human.agent || node.querySelector(".human-compose")) continue
      node.insertAdjacentHTML("beforeend",
        composerHTML("agent", who, `message ${who}`, [
          { do: "notify", label: "tell" },
          { do: "ask", label: "ask" },
        ]))
    }
    wireHumanComposers(boardEl)
  }

  // Unlike the operator view, the panel DOES know which agent is reading, so
  // its own memberships are marked. That is the whole difference between the
  // two surfaces here; the component is identical.
  const chans = state.board?.channels || []
  const chEl = document.getElementById("pane-lanes")
  patchHTML(chEl, Board.channelsHTML(chans, {
    selfId: state.lane,
    agents: state.board?.lanes,
    empty: Board.emptyHTML("No lanes yet",
      "A lane is a piece of work several agents may need. Open one, or declare what you are doing and Lanes will match you."),
  }))
  decorateChannels(chEl)
  // The human's affordances appear only after a person proved they are here.
  // Appended after the shared component rather than passed into it: board.js
  // renders the operator board too, and that surface authenticates differently.
  if (state.human) {
    for (const node of chEl.querySelectorAll(".channel")) {
      const lane = node.dataset.lane || node.dataset.channel
      if (!lane || node.querySelector(".human-compose")) continue
      // Only members may speak — "subscribers read, members speak" is the
      // engine's rule, and offering a button that returns E_NOT_MEMBER is a
      // trap, not an affordance. Driving this for real is what found it: the
      // post came back refused while the question to an agent went through.
      // The web board reached the same conclusion and disables its post and
      // announce for non-members; here there is room to offer the way in.
      const mine = (state.board?.channels || []).find((c) => c.id === lane)
      const member = (mine?.members || []).some((m) => m.agent === state.human.agent)
      node.insertAdjacentHTML("beforeend", member
        ? composerHTML("lane", lane, `say something in ${lane}`, [
            { do: "post", label: "post" },
            { do: "announce", label: "announce" },
          ])
        : `<div class="human-compose" data-kind="join" data-target="${escapeAttr(lane)}">
             <span class="join-note">you are not in this lane yet</span>
             <button class="act" type="button" data-do="join" data-for="">join to speak</button>
           </div>`)
    }
    wireHumanComposers(chEl)
  }
  const tl = document.getElementById("tally-lanes")
  tl.textContent = chans.length
  tl.classList.toggle("zero", chans.length === 0)
  document.getElementById("tab-lanes").setAttribute(
    "aria-label", chans.length ? `Lanes, ${chans.length}` : "Lanes")

  const mailEl = document.getElementById("pane-mail")
  // A redraw must not eat a reply that is half-written.
  //
  // The host pushes a board update whenever this agent does anything, and every
  // push calls draw(), which replaces this pane with innerHTML — destroying the
  // reply textarea, its contents, the focus and the caret. Somebody answering a
  // question loses what they typed the moment their agent makes any tool call.
  // The same defect on the web board wiped a human's message mid-sentence.
  const openReply = document.querySelector('.compose textarea')
  const draft = openReply
    ? { id: openReply.id, value: openReply.value, start: openReply.selectionStart,
        end: openReply.selectionEnd, direction: openReply.selectionDirection,
        focused: document.activeElement === openReply }
    : null
  const mailHTML = state.inbox.length
    ? state.inbox.map((m) => Board.messageHTML(m, opts)).join("")
    : Board.emptyHTML("Nothing waiting",
        "Messages addressed to this lane arrive here. Mail between other agents is private to them.")
  const mailChanged = patchHTML(mailEl, mailHTML)
  // Re-arm the keyboard path first: the textarea is a NEW element, so its
  // handler went with the old one.
  if (state.composing != null) armReply(state.composing)
  if (mailChanged && draft) {
    const el = document.getElementById(draft.id)
    if (el) {
      el.value = draft.value
      if (draft.focused) {
        el.focus()
        try {
          el.setSelectionRange(draft.start, draft.end, draft.direction)
        } catch (_) { /* not selectable */ }
      }
    }
  }
  decorateMail(mailEl)

  const actEl = document.getElementById("pane-activity")
  patchHTML(actEl, state.events.length
    ? state.events.map(Board.eventHTML).join("")
    : Board.emptyHTML("Nothing new",
        "Registrations, claims and messages appear here in ledger order as they happen."))
  decorateEvents(actEl)

  const tm = document.getElementById("tally-mail")
  tm.textContent = state.inbox.length
  tm.classList.toggle("zero", state.inbox.length === 0)
  document.getElementById("tab-mail").setAttribute(
    "aria-label", state.inbox.length ? `Mail, ${state.inbox.length} unanswered` : "Mail")
  const ta = document.getElementById("tally-act")
  ta.textContent = state.events.length
  ta.classList.toggle("zero", state.events.length === 0)
  document.getElementById("tab-activity").setAttribute(
    "aria-label", state.events.length ? `Activity, ${state.events.length} events` : "Activity")

  for (const b of document.querySelectorAll(".act")) {
    b.onclick = () => act(Number(b.dataset.serial), b.dataset.act)
  }
}

function render(params) {
  // Base MCP structuredContent is model-facing. Lanes keeps panel-only board
  // detail in the result metadata backchannel so show_board can honestly cost
  // one summary line. Accept the old carrier during rolling upgrades: a cached
  // v1 server response can reach this v2 template, and blanking the panel would
  // turn a safe transport migration into a silent UI failure.
  //
  // Third carrier, last: the ordinary result content. ack_board and inbox put
  // the whole board and mailbox there for the AGENT, so on a host that drops
  // _meta the state the panel is waiting for has usually arrived already, in the
  // one field every host forwards. Reading it costs nothing and needs nothing
  // from the host beyond delivering the result it already delivered — unlike
  // fetching, which needs the host to proxy a tool call back to Lanes.
  const carried = (params && params._meta && params._meta["com.lanes/panel"])
