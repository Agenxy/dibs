version: "3"

tasks:
  default:
    desc: List tasks
    cmds: [task --list]
    silent: true

  app:
    # Dibs.app: the process that speaks to the person.
    #
    # A notification carries the identity of whoever posts it, so a daemon
    # shelling out to osascript borrows Script Editor's name and icon. The
    # bundle is what makes a message from an agent arrive as Dibs, and
    # UNUserNotificationCenter (which needs a bundle id) is the only API that
    # puts action buttons on the banner itself.
    #
    # macOS only. Elsewhere the daemon simply has no route to a desktop.
    platforms: [darwin]
    desc: Build Dibs.app, the notifier bundle with the product icon
    sources:
      - internal/notify/app/*.swift
      - tools/appbundle/main.go
    generates:
      - bin/Dibs.app/Contents/MacOS/dibs-notify
    vars:
      # The same identity `install` signs the binaries with.
      #
      # The bundle was signed ad hoc unless somebody had exported
      # DIBS_CODESIGN_IDENTITY by hand, which is precisely the arrangement
      # tools/signid exists to end: notification authorisation is remembered
      # against the SIGNATURE, so an ad-hoc rebuild is a new app to macOS and
      # the grant is asked for again. Dibs.app is the one component whose whole
      # job is putting a notification in front of the person, and it was the one
      # component left out of the stable identity. Found by a pre-release
      # review.
      #
      # Computed here rather than duplicated in the Go tool, so there stays one
      # answer to "which identity does this project sign with".
      SIGNER:
        sh: go run ./tools/signid
    cmds:
      - DIBS_CODESIGN_IDENTITY='{{.SIGNER}}' go run ./tools/appbundle -o bin/Dibs.app -version {{.VERSION | default "0.0.0"}}

  presence:
    desc: >-
      Compile the Touch ID presence helper (macOS only). Separate from `build`
      because Dibs ships CGO_ENABLED=0 and cross-compiles to four targets,
      linking LocalAuthentication into the daemon would break every non-macOS
      build. The daemon execs this and degrades to the admin password when it is
      absent, so a platform without it loses one affordance, not the product.
    platforms: [darwin]
    sources:
      - internal/humanauth/presence_darwin.swift
    generates:
      - bin/dibs-presence
    cmds:
      - swiftc -O -o bin/dibs-presence internal/humanauth/presence_darwin.swift

  build:
    desc: Build both binaries
    cmds:
      - go build -o bin/dibd ./cmd/dibd
      - go build -o bin/dibs ./cmd/dibs
      - task: presence
      - task: app

  install:
    desc: Install both binaries to ~/.local/bin (replaces, never overwrites)
    deps: [build]
    vars:
      DEST: '{{.DEST | default (printf "%s/.local/bin" .HOME)}}'
    cmds:
      # rm before cp, deliberately.
      #
      # macOS caches a binary's code-signature validation against its INODE.
      # `cp` over an existing executable reuses the inode with new content, the
      # kernel sees a CDHash that no longer matches, and every later run is
      # SIGKILLed: exit 137, no message, from a file that is byte-identical to
      # a working one and whose signature verifies. It looks like a corrupt
      # download. Replacing the file gives a fresh inode and no cached verdict.
      # Before anything is replaced: an ad-hoc install revokes a macOS
      # permission the user had to click, and the only signal was a printed
      # note that scrolled past. It happened twice in one session.
      - go run ./tools/signcheck
      - mkdir -p {{.DEST}}
      # The names here were rename collateral: this removed `agents`, which has
      # never existed, and then copied over a live `dibs`, reusing exactly the
      # inode the comment above says not to. The failure is a SIGKILL with no
      # message, and it cost an hour before somebody read this line.
      - rm -rf {{.DEST}}/dibs {{.DEST}}/dibd {{.DEST}}/dibs-presence {{.DEST}}/Dibs.app
      - cp bin/dibs bin/dibd {{.DEST}}/
      - task: install:presence
        vars: { DEST: '{{.DEST}}' }
      - task: install:app
        vars: { DEST: '{{.DEST}}' }
      - task: install:sign
        vars: { DEST: '{{.DEST}}' }
      - '{{.DEST}}/dibs version'
      - |
        echo "installed to {{.DEST}}"
        echo "a running dibd keeps the old code until you restart it:"
        echo "  dibs upgrade"

  install:sign:
    # Sign with a STABLE identity when one is configured, because macOS keys a
    # privacy grant to the signature.
    #
    # An ad-hoc signature (the default) gets a fresh code-directory hash from
    # every build, so the system treats each rebuild as a different program and
    # any Files-and-Folders or Full Disk Access grant stops applying. On a
    # machine where checkouts live under ~/Desktop that presents as matching
    # working, then silently not working after the next install, with nothing to
    # point at. Signing with a persistent identity keeps the grant across builds.
    #
    # Set DIBS_CODESIGN_IDENTITY to an identity of DIBS' OWN, not one borrowed
    # from another project on the machine: a grant keyed to somebody else's
    # certificate is silently revoked when they rotate or delete it. `tools/
    # signcheck` says how to make one. Unset, this does nothing and the Go
    # toolchain's ad-hoc signature stands.
    platforms: [darwin]
    internal: true
    vars:
      # Resolved by tools/signid, not by a template conditional here.
      #
      # It answers DIBS_CODESIGN_IDENTITY if set, else Dibs' own identity if it
      # is in the keychain, else "-" for ad-hoc. The middle case is the point:
      # the operator creates the certificate once and every install after it
      # keeps the privacy grant, instead of the fix applying only when somebody
      # remembers an environment variable. Nine installs in one session, nine
      # permission prompts, is what the old behaviour cost.
      #
      # Either way the IDENTIFIER is set: the Go toolchain leaves it as `a.out`,
      # so the daemon would present itself to the system under a name shared
      # with every other ad-hoc binary, and any grant recorded against it is
      # recorded against that.
      SIGNER:
        sh: go run ./tools/signid
    cmds:
      - codesign --force -i org.agenxy.dibs -s '{{.SIGNER}}' {{.DEST}}/dibd
      - codesign --force -i org.agenxy.dibs.cli -s '{{.SIGNER}}' {{.DEST}}/dibs
      # One message, chosen by template. `status:` is a TASK-level field, not a
      # per-command one, so a pair of commands guarded by it printed BOTH: the
      # install claimed in consecutive lines that the grant would and would not
      # survive.
      # Proves the promise rather than restating it: an install whose signature
      # moved has just revoked the operator's folder permission, and they would
      # otherwise find out from a dialog that explains nothing.
      - cmd: go run ./tools/signstable {{.DEST}}
        platforms: [darwin]
      - cmd: >-
          echo
          {{if eq .SIGNER "-"}}"ad-hoc signed: a macOS privacy grant will NOT survive
          the next install, so you will be asked for Desktop/Documents/Downloads
          access again. Give Dibs an identity of its own, ONCE: Keychain Access ->
          Certificate Assistant -> Create a Certificate, name it 'Dibs Local
          Codesign', type Code Signing, self-signed. Every install after that finds
          it by name, with no variable to set."{{else}}"signed as '{{.SIGNER}}', so
          the macOS privacy grant survives this and every later install."{{end}}
        platforms: [darwin]
        silent: true

  install:app:
    # Beside the daemon, for the same reason the presence helper is: notify
    # resolves it relative to its own executable rather than on PATH.
    #
    # Registered with Launch Services afterwards. Without that, macOS does not
    # know the bundle exists and refuses it notification authorisation, which
    # presents as a notifier that posts nothing and reports "cannot notify".
    platforms: [darwin]
    internal: true
    cmds:
      - cp -R bin/Dibs.app {{.DEST}}/
      - /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f {{.DEST}}/Dibs.app

  install:presence:
    # Beside the daemon, because humanauth looks beside its own executable rather
    # than on PATH: substituting the binary that answers "is a human here" would
    # defeat the whole mechanism. macOS only: elsewhere there is nothing to copy
    # and the daemon correctly falls back to the admin password.
    platforms: [darwin]
    internal: true
    cmds:
      - cp bin/dibs-presence {{.DEST}}/

  test:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
    desc: Full test suite with race detector
    cmds:
      - go test -race ./...

  review:release:
    desc: "Pre-release review: a different model reads everything since the last tag"
    # Not the author's own review, deliberately. Versions have been spent fixing
    # things a careful reader would have caught, and the reader who misses them
    # is reliably the one who wrote them.
    #
    # `codex` here because it is what this project has to hand; any capable
    # reviewer that is NOT what wrote the code does the job. What it is pointed
    # at matters more than which one it is: docs/REVIEW.md holds the brief.
    cmds:
      - cmd: |
          if ! command -v codex >/dev/null 2>&1; then
            echo "no reviewer found: install codex, or run docs/REVIEW.md's brief"
            echo "through whichever model you have. The point is that it is not the"
            echo "one that wrote the change."
            exit 1
          fi
          codex exec "$(cat docs/REVIEW.md)

          The diff under review is: git diff $(git describe --tags --abbrev=0)..HEAD
          Read it with git, in pieces if you need to. Work read-only."

  test:dev:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
    desc: The dibdev-tagged code, which the default build excludes
    # `go test ./...` never compiles anything behind the dibdev tag, so the
    # presence mock and its tests would rot silently, and the thing that rots
    # is a security switch. Running both configurations means a change that
    # breaks the mock fails the gate, and, more importantly, that the release
    # half is exercised too: the assertion that an environment variable cannot
    # claim a human is present lives in the UNTAGGED build and runs above, in
    # `test`.
    cmds:
      - go build -tags dibdev ./...
      - go test -race -tags dibdev ./internal/humanauth/ ./internal/mcp/ ./cmd/dibd/

  test:minimal:
    desc: "The stripped diagnostic panel: a serving mode the default suite never enters"
    # DIBS_PANEL_MINIMAL is a real mode: it serves 483 bytes so a person can tell
    # whether a blank board is the panel's fault or the host's. Nothing ran in it,
    # so the package was simply RED there: three full-panel structural tests
    # asserting a template that mode does not serve. A diagnostic you cannot trust
    # is worse than none, because it is reached for at the exact moment somebody
    # is already confused about which layer is broken.
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
      DIBS_PANEL_MINIMAL: "1"
    cmds:
      - go test -count=1 ./internal/mcp/

  test:human:
    desc: "The panel's human actions, end to end: needs a dev daemon, not a finger"
    deps: [build]
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
      DIBS_ALLOW_PARALLEL: "1"
    cmds:
      # The dev daemon is built here rather than by `build`, so it never lands in
      # bin/ during an ordinary build and cannot be picked up by anything that
      # globs for a binary. It is the only dibd on this machine that will
      # answer a presence check from an environment variable.
      - go build -tags dibdev -o bin/dibd-dev ./cmd/dibd
      - cd internal/mcp/e2e && bun install --frozen-lockfile
      - bun internal/mcp/e2e/human_e2e.ts

  test:panel:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
      # These suites spawn several daemons at once by design. The
      # host-wide guard exists to stop a fleet being silently split
      # across two boards, which is not what an isolated test dir is.
      DIBS_ALLOW_PARALLEL: "1"
    desc: "Board panel end-to-end: real Chrome, real AppBridge, real daemon"
    deps: [build]
    cmds:
      - cd internal/mcp/e2e && bun install --frozen-lockfile
      - DIBD=$PWD/bin/dibd bun internal/mcp/e2e/panel_e2e.ts

  panel:inspect:
    desc: >-
      Look at the board panel as it renders RIGHT NOW against the live daemon,
      and print what it drew as text. --drop meta|structured|content reproduces
      a host that withholds a carrier, which is how panel blankness gets
      diagnosed instead of guessed at. --unlock clicks the human lock and
      re-reads, which needs a daemon built with -tags dibdev unless you want a
      real fingerprint prompt (see CONTRIBUTING.md).
    cmds:
      - cd internal/mcp/e2e && bun install --frozen-lockfile
      - bun internal/mcp/e2e/panel_inspect.ts {{.CLI_ARGS}}

  test:web:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
      # These suites spawn several daemons at once by design. The
      # host-wide guard exists to stop a fleet being silently split
      # across two boards, which is not what an isolated test dir is.
      DIBS_ALLOW_PARALLEL: "1"
    desc: Web board end-to-end, including the admin gate
    deps: [build]
    cmds:
      - cd internal/mcp/e2e && bun install --frozen-lockfile
      - DIBD=$PWD/bin/dibd DIBS=$PWD/bin/dibs bun internal/mcp/e2e/web_e2e.ts

  test:guard:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
      # These suites spawn several daemons at once by design. The
      # host-wide guard exists to stop a fleet being silently split
      # across two boards, which is not what an isolated test dir is.
      DIBS_ALLOW_PARALLEL: "1"
    desc: "Claim guard end-to-end: the real stdio bridge and the real opencode plugin"
    deps: [build]
    cmds:
      - cd internal/mcp/e2e && bun install --frozen-lockfile
      - DIBD=$PWD/bin/dibd DIBS=$PWD/bin/dibs bun internal/mcp/e2e/guard_e2e.ts

  test:space:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
      # These suites spawn several daemons at once by design. The
      # host-wide guard exists to stop a fleet being silently split
      # across two boards, which is not what an isolated test dir is.
      DIBS_ALLOW_PARALLEL: "1"
    desc: "Spaces end-to-end: auto-join, exclusivity, announcements, over real HTTP"
    deps: [build]
    cmds:
      - cd internal/mcp/e2e && bun install --frozen-lockfile
      - DIBD=$PWD/bin/dibd DIBS=$PWD/bin/dibs MATCH_REPO=$PWD bun internal/mcp/e2e/channel_e2e.ts

  test:sidecar:
    env:
      # No dialogs from a test run: these suites spawn real daemons,
      # which notify like any other. See internal/notify silenceEnv.
      DIBS_NOTIFY: "off"
    desc: "Embedding sidecar contract check: no model, no repository needed"
    cmds:
      - python3 contrib/embed-sidecar/dibs_embed.py --self-test

  fleet:
    desc: "Real harnesses + real models + a human on one board (costs model calls)"
    # Not in `ci`: it spends money and depends on provider availability. It is
    # the only test that answers "does a REAL harness, with a real model deciding
    # what to call, actually coordinate": everything else drives Dibs through
    # its own client code.
    cmds:
      - task: build
      - ./internal/mcp/e2e/fleet_scenario.py

  calibrate:compare:
    desc: "Tier 0 vs an embeddings service, same cases (needs EMBED_URL, EMBED_MODEL)"
    # Deliberately NOT a dependency of `ci`. Dibs runs fully on tier 0 with
    # nothing installed, and tier 2 accepts any OpenAI-compatible service,
    # Ollama, vLLM, TEI, LM Studio, llama.cpp, hosted. Pinning one of them in
    # the manifest would pick a winner for the operator on an optional feature.
    # What this DOES fix is reproducibility: the published tier-2 numbers were
    # measured by hand, which meant nobody else could check them.
    vars:
      EMBED_URL: '{{.EMBED_URL | default "http://127.0.0.1:11434"}}'
      EMBED_MODEL: '{{.EMBED_MODEL | default "qwen3-embedding:0.6b"}}'
      N: '{{.N | default "40"}}'
    cmds:
      - task: build
      - |
        if ! curl -sf -m 3 {{.EMBED_URL}}/v1/embeddings -H 'content-type: application/json' \
             -d '{"model":"{{.EMBED_MODEL}}","input":["probe"]}' >/dev/null 2>&1; then
          echo "no embeddings service at {{.EMBED_URL}}"
          echo "  ollama:  brew install ollama && ollama serve && ollama pull {{.EMBED_MODEL}}"
          echo "  or set EMBED_URL/EMBED_MODEL to any OpenAI-compatible endpoint"
          exit 1
        fi
      - echo "═══ tier 0 ═══"
      - ./bin/dibs calibrate -n {{.N}}
      - echo "═══ tier 2. {{.EMBED_MODEL}} ═══"
      - ./bin/dibs calibrate -n {{.N}} -embed-url {{.EMBED_URL}} -embed-model {{.EMBED_MODEL}}

  calibrate:
    desc: Measure work-overlap scoring against this repo's history
    deps: [build]
    cmds:
      - ./bin/dibs calibrate

  cover:
    desc: Coverage on core + ledger. SPEC §17 floor of 85%, enforced
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./internal/core/ ./internal/ledger/
      - go tool cover -func=coverage.out | tail -3
      # Enforced, not printed. This step exited 0 whatever the number said, so
      # the §17 floor was a sentence in a document while coverage sat six tenths
      # of a point above it.
      - go run ./tools/covergate -profile coverage.out -min 85

  lint:
    desc: golangci-lint v2, zero warnings
    cmds:
      - golangci-lint run

  fmt:
    desc: Format (gofumpt via golangci-lint)
    cmds:
      - golangci-lint fmt

  vet:
    cmds: [go vet ./...]

  vuln:
    desc: govulncheck (call-graph-aware)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  dev:
    desc: Run the daemon in the foreground on a dev data dir
    env:
      DIBS_DIR: '{{.HOME}}/.dibs-dev'
    cmds:
      - go run ./cmd/dibd --dir $HOME/.dibs-dev

  crosscompile:
    desc: Build every release target, so a portability break fails here not at tag time
    # In `ci` because CONTRIBUTING.md promises it is, and because the failure it
    # catches is invisible on the host: Dibs ships CGO_ENABLED=0 to four targets,
    # and a Linux-only build break stays hidden on a Mac until the release runs.
    cmds:
      - GOOS=linux  GOARCH=amd64 go build ./...
      - GOOS=linux  GOARCH=arm64 go build ./...
      - GOOS=darwin GOARCH=arm64 go build ./...
      - GOOS=darwin GOARCH=amd64 go build ./...

  smoke:
    desc: Run the built binaries and read what they say about themselves
    deps: [build]
    cmds:
      - go run ./tools/smoke

  release:
    # The last hand-edited step in a pipeline that has no other.
    #
    # A release used to mean: rename the changelog heading, remember the date,
    # then edit four JSON manifests, and every one of those is a place to stop
    # halfway. It drifted twice: the Claude Code manifest sat at 0.0.0 through
    # five releases and the Claude Desktop one still did, both valid JSON,
    # both passing every validator, neither caught by anything.
    #
    # Stamps and stops. Tagging publishes signed artifacts, moves the Homebrew
    # cask and writes to the MCP registry, so it stays the owner's to perform;
    # this prints the commands rather than running them.
    desc: 'Stamp a release across the changelog and every manifest: task release VERSION=0.0.6'
    requires:
      vars: [VERSION]
    cmds:
      - go run ./tools/version -set {{.VERSION}}

  ci:
    desc: The full local gate chain (mirrors CI)
    cmds:
      - task: vet
      - task: lint
      - task: test
      - task: test:dev
      - task: build
      - task: smoke
      - task: test:panel
      - task: test:web
      - task: test:guard
      - task: test:space
      - task: test:sidecar
      - task: test:human
      - task: test:minimal
      - task: cover
      - task: crosscompile
      - task: vuln
