version: 2

project_name: agents

# The man page is generated from the CLI's own usage text at release time,
# never committed: a checked-in page is a second copy of the help, and the
# copy loses (man_test.go holds the generated one to every dispatched verb).
# The commit date pins the one piece of content that would otherwise differ
# between two builds of the same commit: the same reproducibility rule the
# archive applies to its file timestamps below.
before:
  hooks:
    - go run ./cmd/dibs man -out agents.1 -date {{ .CommitDate }}

builds:
  - id: dibd
    main: ./cmd/dibd
    binary: dibd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/agenxy/dibs/internal/build.Version={{.Version}}"]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: agents
    main: ./cmd/dibs
    binary: agents
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/agenxy/dibs/internal/build.Version={{.Version}}"]
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    # Normalise the ownership recorded in the tar headers.
    #
    # Without this the archive carries whoever built it: a local dry run
    # produced tar headers naming the builder's own account and group, which
    # puts that name inside every published tarball. GitHub-hosted runs would say
    # `runner` instead, so the leak only appears when a release is cut or
    # repaired from a workstation, which is exactly when nobody is looking for
    # it.
    #
    # Ownership only, despite the mtime below. GoReleaser 2.17.1 applies
    # owner/group/mode from here to the compiled binaries but not `mtime`, so a
    # binary's header keeps its build time and two archives built from identical
    # bytes still hash differently. The mtime IS applied to the doc files listed
    # further down. The BINARIES are byte-for-byte reproducible: verified by
    # building twice and comparing hashes, and that is what the README claims;
    # the tar wrapper around them is not, and this comment will not pretend
    # otherwise.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    # The doc files too. builds_info covers only the compiled binaries, so
    # naming these explicitly is what stops LICENSE/README/CHANGELOG carrying
    # the builder's account. Listing them also replaces GoReleaser's implicit
    # default set, which is the whole point: the default is what had no `info`.
    files:
      - src: LICENSE
        info: &archive_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      # NOTICE ships with LICENSE, not as an afterthought beside it. Apache 2.0
      # section 4(d) requires redistributions of a work that has one to carry it,
      # and after the relicensing ours holds the retained MIT attribution for the
      # contributions made before it. Listing these files explicitly replaced
      # GoReleaser's default set, and NOTICE arrived later than the list did, so
      # every archive was shipping without it.
      - src: NOTICE
        info: *archive_file_info
      - src: README.md
        info: *archive_file_info
      - src: CHANGELOG.md
        info: *archive_file_info
      # Generated by the before hook above; `man ./agents.1` works straight
      # from the unpacked archive, and the cask installs it properly.
      - src: agents.1
        info: *archive_file_info

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # cosign 3. `sign-blob` dropped --output-signature/--output-certificate in
  # favour of a single Sigstore bundle carrying the signature, the certificate
  # and the transparency-log entry together, so verification needs one file
  # instead of three that can be separated in transit.
  - cmd: cosign
    signature: "${artifact}.bundle"
    args: ["sign-blob", "--yes", "--bundle", "${signature}", "${artifact}"]
    artifacts: checksum

release:
  draft: true
  # The release page showed GoReleaser's autogenerated commit list, which for a
  # squashed first release was one line reading "Dibs v0.0.0": next to signed
  # artifacts and SBOMs, that reads as an unfinished project.
  #
  # This header is what a reader needs first: how to install it and how to check
  # what they downloaded. The commit list follows. CHANGELOG.md is NOT inlined,
  # an earlier version of this comment said it was, which was never true; it is
  # linked instead, because it documents the product across versions and pasting
  # all of it into every release makes each one look like the whole history.
  header: |
    Install: `brew install agenxy/tap/agents`, or `go install github.com/agenxy/dibs/cmd/dibs@{{ .Tag }}` and the same for `cmd/dibd`.

    Verify the artifacts (cosign 3, bundle format):

    ```sh
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity 'https://github.com/Agenxy/agents/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
    ```

    Full notes for this release: [CHANGELOG.md](https://github.com/agenxy/dibs/blob/{{ .Tag }}/CHANGELOG.md)

    ---

# `brews` (Formulas) is deprecated: GoReleaser generated hand-rolled formulas to
# install pre-compiled binaries, and Casks are the supported way to do that now.
# https://goreleaser.com/deprecations#brews
homebrew_casks:
  - repository:
      owner: agenxy
      name: homebrew-tap
      # Pushed over SSH with a DEPLOY KEY, not an account token.
      #
      # A token here is necessarily broader than the job needs: the default
      # GITHUB_TOKEN cannot reach another repository at all, so the alternative
      # is a personal token, and the smallest personal token still belongs to a
      # human and outlives this workflow. A deploy key belongs to one
      # repository, grants exactly write-to-the-tap, is revocable from the tap's
      # own settings without touching anybody's account, and cannot be used to
      # read or write anything else in the org.
      #
      # The key exists only in CI, so a local `goreleaser release --snapshot`
      # stops here with "map has no entry for key HOMEBREW_TAP_DEPLOY_KEY".
      # That is the config working. Add --skip=homebrew locally.
      git:
        url: git@github.com:Agenxy/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
      # No `token:` here, deliberately. It is the API path, and the git block
      # above replaces it: with a url and a private key set, GoReleaser clones,
      # commits and pushes over SSH and never calls the API. The token line
      # outlived the token it named, and since GoReleaser fails on a
      # `{{ .Env.X }}` whose X is unset, it would have failed the release at the
      # cask step, after the tag was already pushed and spent.
    directory: Casks
    homepage: https://github.com/agenxy/dibs
    description: "Coordination and situational-awareness board for AI agents on one machine"
    license: Apache-2.0
    # BOTH binaries. The default links only the project name, which generated a
    # cask installing `dibs` and not `dibd`: a CLI with no daemon, so
    # `brew install` produced something that cannot work at all. The archive
    # always contained both; only the linking was wrong, which is the kind of
    # thing that looks fine right up until somebody installs it.
    binaries:
      - agents
      - dibd
    # So `man dibs` answers on a brew install, which is where most people
    # first look for it.
    manpages:
      - agents.1
    hooks:
      post:
        # Clear the quarantine attribute Homebrew puts on downloaded artifacts.
        # These binaries are cosign-signed for provenance but NOT Apple-notarised,
        # so without this macOS refuses to run them. "cannot be opened because
        # the developer cannot be verified", AFTER a successful install, which
        # reads as a broken product rather than an unsigned one.
        install: |
          system_command "/usr/bin/xattr",
                         args:         ["-dr", "com.apple.quarantine", staged_path.to_s],
                         must_succeed: false
    caveats: |
      Start the daemon and point your agents at it:

        dibd &                  # 127.0.0.1:4777, data in ~/.agents
        dibs mcp-config          # MCP config to add to your harness
        dibs admin set-password  # once, before `dibs web`
        dibs doctor              # what is quietly broken, and how to fix it

      Signed for provenance with cosign, but not notarised by Apple, so this
      cask clears the quarantine flag on install.
