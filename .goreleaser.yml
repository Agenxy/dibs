version: 2

# Only the extra pre-tag snapshot uses the production version. The ordinary
# task ci archive probe keeps its existing snapshot stamp.
snapshot:
  version_template: '{{ if index .Env "DIBS_SNAPSHOT_RELEASE_VERSION" }}{{ index .Env "DIBS_SNAPSHOT_RELEASE_VERSION" }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

project_name: dibs

# The man page is generated from the CLI's own usage text at release time,
# never committed: a checked-in page is a second copy of the help, and the
# copy loses (man_test.go holds the generated one to every dispatched verb).
# The commit date pins the one piece of content that would otherwise differ
# between two builds of the same commit: the same reproducibility rule the
# archive applies to its file timestamps below.
before:
  hooks:
    - go run ./cmd/dibs man -out dibs.1 -date {{ .CommitDate }}
    - go run ./cmd/dibd -man -out dibd.8 -date {{ .CommitDate }}
    # The Touch ID helper, which is Swift and therefore not a `builds` entry.
    #
    # Without this the published archives and the Homebrew cask contained dibd
    # and dibs only, and the runtime looks for the helper BESIDE the executable:
    # so every installed copy silently fell back to the admin password while the
    # documentation described a presence-first flow. A source install got it and
    # a released one did not, which is the worst way round. The release job runs
    # on macos-latest, so swiftc is there. Found by the pre-release review.
    # AN EXPLICIT TARGET, not the release runner's default.
    #
    # Built with no -target this is whatever the runner happened to be, which is
    # how the notifier beside it shipped for the wrong architecture: the failure
    # is silent, because humanauth finds no usable helper, falls back to the
    # admin password, and Touch ID quietly stops existing. Stating the target
    # makes the artifact a property of the file rather than of the machine.
    #
    # arm64 only: Dibs does not ship a Mac Intel build. See the `ignore` below.
    - swiftc -O -target arm64-apple-macos11 -o dibs-presence internal/humanauth/presence_darwin.swift
    - lipo -info dibs-presence
    - go run ./tools/signrelease -sign dibs-presence
    # AND THE NOTIFIER BUNDLE, for the same reason and found the same way.
    #
    # internal/notify looks for Dibs.app/Contents/MacOS/dibs-notify beside the
    # executable, and Reach reports notifications unavailable without it. Only
    # `task install` built it, so source builds had the branded, actionable
    # notification docs/INSTALL.md lists as a required artifact and every published
    # archive and brew install did not: a release whose whole
    # human-in-the-loop story is a component nobody downloading it receives.
    # The Touch ID helper above had exactly this hole one review round earlier.
    #
    # -target, because this bundle is for the archive rather than for the
    # machine building it. Without one the notifier is whatever the release
    # runner happened to be, which is how it shipped arm64-only into an Intel
    # tarball. `task app` deliberately passes none: a local build is for the
    # Mac doing the building, and forcing the release's answer there broke
    # building from source on an Intel Mac, which is the documented escape
    # hatch now that the release does not cover it.
    - go run ./tools/appbundle -o Dibs.app -presence dibs-presence -version {{ .Version }} -target arm64-apple-macos12
    # AGAIN, and not instead: appbundle signs so that a bundle is always valid,
    # and signs without an identifier. This is the pass that gives it the one
    # macOS records a notification grant against.
    - go run ./tools/signrelease -sign Dibs.app

builds:
  - id: dibd
    main: ./cmd/dibd
    binary: dibd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/agenxy/dibs/internal/build.Version={{.Version}}"]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # NO MAC INTEL BUILD. Apple is ending Intel support, and carrying the target
    # means a second Swift slice for the presence helper, a second one for the
    # notifier, lipo for both, and an archive nobody will install: cost paid
    # every release for a platform on its way out. Linux keeps amd64, which is
    # not going anywhere.
    #
    # Removing the target rather than shipping universal binaries is the whole
    # point: a fat binary still has to be built, joined and checked on both
    # sides, and the checking is where the last two defects were.
    ignore: [{goos: darwin, goarch: amd64}]
    # SIGNED HERE, between the build and the archive, because that is the only
    # moment the file exists and nothing has packed it yet.
    #
    # It gives the binary an identifier and, when the release has a
    # certificate, a signature that does not change between versions. Without
    # that, macOS sees every update as a different program: the published dibd
    # introduced itself as `a.out` with an ad-hoc signature, so an operator who
    # allowed it through the firewall was asked again on the next upgrade, and
    # so was everybody else. The tool is a no-op on the Linux targets and says
    # so rather than appearing to have worked.
    hooks:
      post:
        - go run ./tools/signrelease -sign {{ .Path }}
        - go run ./tools/appbundle -embed-daemon {{ .Path }} -presence dibs-presence -o Dibs.app
  - id: dibs
    main: ./cmd/dibs
    binary: dibs
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/agenxy/dibs/internal/build.Version={{.Version}}"]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # NO MAC INTEL BUILD. Apple is ending Intel support, and carrying the target
    # means a second Swift slice for the presence helper, a second one for the
    # notifier, lipo for both, and an archive nobody will install: cost paid
    # every release for a platform on its way out. Linux keeps amd64, which is
    # not going anywhere.
    #
    # Removing the target rather than shipping universal binaries is the whole
    # point: a fat binary still has to be built, joined and checked on both
    # sides, and the checking is where the last two defects were.
    ignore: [{goos: darwin, goarch: amd64}]
    # SIGNED HERE, between the build and the archive, because that is the only
    # moment the file exists and nothing has packed it yet.
    #
    # It gives the binary an identifier and, when the release has a
    # certificate, a signature that does not change between versions. Without
    # that, macOS sees every update as a different program: the published dibd
    # introduced itself as `a.out` with an ad-hoc signature, so an operator who
    # allowed it through the firewall was asked again on the next upgrade, and
    # so was everybody else. The tool is a no-op on the Linux targets and says
    # so rather than appearing to have worked.
    hooks:
      post:
        - go run ./tools/signrelease -sign {{ .Path }}

archives:
  - formats: [tar.gz]
    # Normalise the ownership recorded in the tar headers.
    #
    # Without this the archive carries whoever built it: a local dry run
    # produced tar headers naming the builder's own account and group, which
    # puts that name inside every published tarball. GitHub-hosted runs would say
    # `runner` instead, so the leak only appears when a release is cut or
    # repaired from a workstation, which is exactly when nobody is looking for
    # it.
    #
    # Ownership only, despite the mtime below. GoReleaser 2.17.1 applies
    # owner/group/mode from here to the compiled binaries but not `mtime`, so a
    # binary's header keeps its build time and two archives built from identical
    # bytes still hash differently. The mtime IS applied to the doc files listed
    # further down. The BINARIES are byte-for-byte reproducible: verified by
    # building twice and comparing hashes, as docs/INSTALL.md claims;
    # the tar wrapper around them is not, and this comment will not pretend
    # otherwise.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    # The doc files too. builds_info covers only the compiled binaries, so
    # naming these explicitly is what stops LICENSE/README/CHANGELOG carrying
    # the builder's account. Listing them also replaces GoReleaser's implicit
    # default set, which is the whole point: the default is what had no `info`.
    files:
      - src: LICENSE
        info: &archive_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      # Retained outside and third-party permissions ship with the new GPL
      # licence, including the original Apache text and font/dependency notices.
      - src: NOTICE
        info: *archive_file_info
      - src: LICENSES/**/*
        strip_parent: false
        info: *archive_file_info
      - src: COMMERCIAL-LICENSING.md
        info: *archive_file_info
      - src: README.md
        info: *archive_file_info
      - src: CHANGELOG.md
        info: *archive_file_info
      # The Touch ID helper. `internal/humanauth` finds it BESIDE the
      # executable, which is why it has to be in the archive rather than merely
      # built.
      #
      # It lands in the Linux archives too, where it is an inert Mach-O file.
      # GoReleaser filters archives by build id and both builds cover darwin and
      # linux, so excluding it would mean splitting the archive definition in
      # two and maintaining the ownership and mtime normalisation above in both.
      # A stray 100 KB file on Linux is the cheaper wart, and saying so here is
      # better than a comment claiming a darwin-only ship that is not happening.
      - src: dibs-presence
        dst: dibs-presence
        info:
          owner: root
          group: root
          mode: 0755
          mtime: "{{ .CommitDate }}"
      # The notifier bundle, whole: it is a directory, and the executable
      # inside it is what internal/notify resolves.
      # src is the DIRECTORY and dst its name in the archive. A `Dibs.app/**/*`
      # glob here silently ate the `Contents` level: the archive carried
      # `Dibs.app/MacOS/dibs-notify`, which is not a bundle macOS recognises and
      # is not the path internal/notify resolves. Every published archive would
      # have reported "Dibs.app is not installed beside the binary" and fallen
      # back to osascript under Script Editor's name: the exact failure the round
      # that ADDED this entry believed it had closed. tools/archivecheck opens
      # the built archive now, because the guard that read this file saw a
      # correct `src: Dibs.app` substring in the broken form.
      - src: Dibs.app
        dst: Dibs.app
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      # Generated by the before hook above; `man ./dibs.1` works straight
      # from the unpacked archive, and the cask installs it properly.
      - src: dibs.1
        info: *archive_file_info
      # The DAEMON's manual, section 8. dibd is what an operator installs as a
      # service, points at a listen address and configures with a file, and it
      # had no page at all: the CLI is discoverable by typing `dibs help`, and a
      # daemon under launchd is discoverable by reading about it.
      - src: dibd.8
        info: *archive_file_info

checksum:
  name_template: checksums.txt
  # Hash the final post-codesign images during checksum generation, AFTER
  # archiving. archivecheck independently extracts every packaged dibs and
  # requires exact equality with these lines. No earlier build-stage digest,
  # second manifest or separately signed capability assertion is used.
  # The namespace names archive members, not extra downloadable release assets.
  extra_files:
    - glob: "dist/dibs_darwin_arm64_*/dibs"
      name_template: members/darwin_arm64/dibs
    - glob: "dist/dibs_linux_amd64_*/dibs"
      name_template: members/linux_amd64/dibs
    - glob: "dist/dibs_linux_arm64_*/dibs"
      name_template: members/linux_arm64/dibs

sboms:
  - artifacts: archive

signs:
  # cosign 3. `sign-blob` dropped --output-signature/--output-certificate in
  # favour of a single Sigstore bundle carrying the signature, the certificate
  # and the transparency-log entry together, so verification needs one file
  # instead of three that can be separated in transit.
  - cmd: cosign
    signature: "${artifact}.bundle"
    args: ["sign-blob", "--yes", "--bundle", "${signature}", "${artifact}"]
    artifacts: checksum

release:
  # PUBLISHED, not drafted.
  #
  # This was true for every release to v0.0.4, and the effect was that Dibs had
  # no working public install at all. A draft's artifacts are visible only to
  # accounts with push access, while the tag it names is public, so the tap's
  # cask pointed at `releases/download/v0.0.4/...` and that URL returned 404 for
  # everyone on earth except the owner. `brew install agenxy/tap/dibs`, the
  # first command in the README, had never worked for anybody else. An operator
  # who evaluated Dibs built it from source with `go build ./cmd/...`; that may
  # not have been a preference.
  #
  # Production releaseflow uses --skip=publish and controls the draft itself:
  # the complete uploaded signed assets verify before it un-drafts. This value
  # describes direct GoReleaser use, not an instruction to bypass that boundary.
  draft: false
  # The release page showed GoReleaser's autogenerated commit list, which for a
  # squashed first release was one line reading "Dibs v0.0.0": next to signed
  # artifacts and SBOMs, that reads as an unfinished project.
  #
  # This header is what a reader needs first: how to install it and how to check
  # what they downloaded. The commit list follows. CHANGELOG.md is NOT inlined,
  # an earlier version of this comment said it was, which was never true; it is
  # linked instead, because it documents the product across versions and pasting
  # all of it into every release makes each one look like the whole history.
  header: |
    Install: `brew install agenxy/tap/dibs`, or `go install github.com/agenxy/dibs/cmd/dibs@{{ .Tag }}` and the same for `cmd/dibd`.

    Verify the artifacts (cosign 3, bundle format):

    ```sh
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity 'https://github.com/Agenxy/dibs/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
    ```

    Full notes for this release: [CHANGELOG.md](https://github.com/agenxy/dibs/blob/{{ .Tag }}/CHANGELOG.md)

    ---

# `brews` (Formulas) is deprecated: GoReleaser generated hand-rolled formulas to
# install pre-compiled binaries, and Casks are the supported way to do that now.
# https://goreleaser.com/deprecations#brews
homebrew_casks:
  - repository:
      owner: agenxy
      name: homebrew-tap
      # Pushed over SSH with a DEPLOY KEY, not an account token.
      #
      # A token here is necessarily broader than the job needs: the default
      # GITHUB_TOKEN cannot reach another repository at all, so the alternative
      # is a personal token, and the smallest personal token still belongs to a
      # human and outlives this workflow. A deploy key belongs to one
      # repository, grants exactly write-to-the-tap, is revocable from the tap's
      # own settings without touching anybody's account, and cannot be used to
      # read or write anything else in the org.
      #
      # Offline snapshots render the cask with an empty deploy-key variable and
      # --skip=publish. No key is needed to inspect the generated artifact;
      # only the publication step may contact this repository.
      # A BRANCH, never main. The tap requires changes to go through a pull
      # request, and GoReleaser pushed straight at main, so v0.0.6 published
      # every artifact and then failed on its last step with GH013: the release
      # was out and the cask stayed at 0.0.5 until somebody opened the PR by
      # hand. A red release job for a release that actually succeeded is the
      # worst of both, because the next person reads the red and wonders what
      # else did not happen.
      #
      # The ruleset protects main and not other refs, so this lands and the
      # release stays green. Opening the PR still needs a token: a deploy key
      # can push and cannot call the API, and that is the trade the key was
      # chosen for. Merging it is one click, or a workflow in the tap can watch
      # for `cask-*`.
      branch: "cask-{{ .Version }}"
      git:
        url: git@github.com:Agenxy/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
      # No `token:` here, deliberately. It is the API path, and the git block
      # above replaces it: with a url and a private key set, GoReleaser clones,
      # commits and pushes over SSH and never calls the API. The token line
      # outlived the token it named, and since GoReleaser fails on a
      # `{{ .Env.X }}` whose X is unset, it would have failed the release at the
      # cask step, after the tag was already pushed and spent.
    directory: Casks
    homepage: https://github.com/agenxy/dibs
    description: "Coordination and situational-awareness board for fleets of AI agents"
    license: GPL-3.0-or-later
    # BOTH binaries. The default links only the project name, which generated a
    # cask installing `dibs` and not `dibd`: a CLI with no daemon, so
    # `brew install` produced something that cannot work at all. The archive
    # always contained both; only the linking was wrong, which is the kind of
    # thing that looks fine right up until somebody installs it.
    binaries:
      - dibs
      - dibd
    # Platform selection belongs in the generated cask, not in the archive:
    # the Mac helpers ship in all archives but must not be installed on Linux.
    custom_block: |
      on_macos do
        binary "dibs-presence"
        app "Dibs.app"
        caveats <<~EOS
          First install: register the service from your own terminal:

            dibs configure --service

          This registers Dibs.app's background service for your existing board.
          Approve it in System Settings > General > Login Items & Extensions.
          Desktop/Documents/Downloads reads may need approval under Privacy &
          Security > Files & Folders > Dibs. Touch ID unlocks the board on this Mac.

          To update an existing service: brew upgrade dibs, then dibs upgrade.
          Do not register it again after each upgrade.
          Before brew uninstall: dibs configure --service --remove
          If already uninstalled: brew install --cask agenxy/tap/dibs, then
          dibs configure --service --remove, then brew uninstall --cask dibs.
          Then remove any existing registration before uninstalling again.

          Signed for provenance with cosign, but not notarised by Apple. The
          cask tries to clear quarantine; failure is non-fatal. If macOS still
          says the developer cannot be verified, finish from your terminal:

            xattr -dr com.apple.quarantine "$(brew --prefix)/bin/dibd" "$(brew --prefix)/bin/dibs" "#{appdir}/Dibs.app"

          dibs mcp-config prints your harness configuration; dibs web opens the
          board; dibs doctor reports problems and their corrective commands.
        EOS
      end
      on_linux do
        caveats <<~EOS
          First install: configure the user service from your own terminal:

            dibs configure --service
            systemctl --user enable --now dibs

          The unit lives at ~/.config/systemd/user/dibs.service and retains your
          existing board. For desktop notifications install notify-send (the
          libnotify package; libnotify-bin on Debian/Ubuntu).

          To update an existing service: brew upgrade dibs, then dibs upgrade.
          Do not configure it again after each upgrade. Doctor reports an old
          unit that needs repair; locally tuned units are preserved.

          dibs mcp-config prints your harness configuration; dibs web opens the
          board; dibs doctor reports problems and their corrective commands.
        EOS
      end
    # So `man dibs` answers on a brew install, which is where most people
    # first look for it.
    manpages:
      - dibs.1
      - dibd.8
    # Homebrew 7 runs steps with a private HOME. Service setup belongs to the
    # user's explicit configure command, never to a sandboxed cask flight.
    # Only bounded preparation of downloaded Mac files remains here.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"], must_succeed: false
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .AppDir }}/Dibs.app"], must_succeed: false
          end
