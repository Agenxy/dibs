# Keep dependencies current without anyone having to remember to look.
#
# Grouped rather than one pull request per bump: a maintainer reviewing eight
# separate patch bumps reviews none of them, and a wall of open PRs is how a
# repository starts looking abandoned.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The browser end-to-end suites.
  #
  # `bun`, not `npm`, because this directory's lockfile is bun.lock and the
  # gate installs with --frozen-lockfile. Under the npm ecosystem Dependabot
  # edited package.json and left the lockfile alone, so `bun install` refused
  # and EVERY pull request it raised here failed the gate on
  # "lockfile had changes, but lockfile is frozen", so it sat open red for a
  # week, looking like neglect on a public repository while updating nothing.
  #
  # The trade is that the bun ecosystem does version updates and not security
  # updates. Worth it: these are browser test dependencies, they are in no
  # shipped artifact, and a security update that cannot merge is not a
  # security update. Revisit if GitHub adds security updates for bun.
  - package-ecosystem: bun
    directory: "/internal/mcp/e2e"
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]
