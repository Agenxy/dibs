# Publish the server entry to the official MCP Registry.
#
# This is how AGENTS find Dibs. The Homebrew tap serves people who already know
# the name; the registry is where a harness or an agent looks up MCP servers it
# has never heard of, which for this product is the audience that matters.
#
# Runs on the same trigger as the release, so the registry entry, the GitHub
# release and the Homebrew cask all track a tag and cannot drift from each
# other. The version is taken FROM THE TAG rather than read from server.json, so
# a stamped file that somebody forgot to bump cannot publish a lie.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  # So an already-tagged version can be published without moving the tag, which
  # this project does not do. Also the recovery path when the registry is down
  # at release time: the artifacts are already out, only this step needs redoing.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.0.5 (defaults to the latest release)"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC proves we own the io.github.agenxy namespace
      contents: read
    steps:
      # Checks out whatever ref this ran from: the tag on a tag push, the branch
      # on a manual dispatch. NOT the version being published, which was the
      # first thing that broke here: dispatching v0.0.5 checked out a tag that
      # predated server.json, and jq failed on a file that did not exist yet.
      # The manifest describes the server; the version says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The steps below run this repository's own Go tools rather than shell,
      # so the toolchain is pinned here the same way ci.yml and release.yml pin
      # it. The runner image ships a Go, and which one it ships is not ours to
      # depend on.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # PINNED, like ci.yml and release.yml. The action commit was pinned
          # and the mise VERSION was not, so this step downloaded whatever
          # `latest` meant that morning, in a job holding id-token: write. That
          # is the same "a moving target with our identity" shape the comment
          # below refuses for mcp-publisher, three lines further down, and it
          # went in with the step that quotes it.
          version: 2026.7.7

      # PINNED and CHECKSUMMED, not piped from a redirect.
      #
      # The registry's own guide suggests `curl -L .../latest/download/... | tar
      # xz`. This job holds id-token: write, and `latest` is a moving target, so
      # that would let whoever controls that asset run code with our OIDC
      # identity and no version recorded. release.yml already refuses the same
      # shape for mise, with the reasoning written out; this matches it.
      # The version and digest live on the command line and nowhere else: two
      # copies of a pin is how a pin goes stale in one of them.
      - name: Install mcp-publisher (pinned)
        run: >-
          go run ./tools/fetchpinned
          -url https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          -sha256 a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          -extract mcp-publisher

      # The tag is the truth. server.json carries a version so the file is valid
      # on its own and readable in the tree, but what gets published is whatever
      # was actually released.
      - name: Stamp the released version into server.json
        env:
          GH_TOKEN: ${{ github.token }}
          # THROUGH THE ENVIRONMENT, never interpolated into the command.
          # `${{ }}` is substituted into the run line as text before anything
          # runs, so a dispatch input becomes part of the command itself. That
          # is GitHub's own documented script-injection shape, and it is the
          # same reason this repository does not write shell here at all.
          DIBS_PUBLISH_VERSION: ${{ inputs.version }}
        run: go run ./tools/stampserver

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
