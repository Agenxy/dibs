name: app restart old-source red proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  old-source-red:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
          experimental: true
      - name: isolated Python runner
        run: mise install uv@0.9.5
      - name: assert unchanged-main headline behavior is RED
        run: mise exec uv@0.9.5 -- uv run --script tools/apprestart_old_red.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: app-restart-old-red
          path: app-restart-proof-logs
