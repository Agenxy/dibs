name: published Linux install

on:
  pull_request:
    paths:
      - .github/workflows/public-install-check.yml
      - tools/publicinstall/**
  workflow_dispatch:

permissions:
  contents: read

# A public-release acceptance finding, separate from the candidate's gate.
# A failing published install stays red and keeps its receipt; no continue-on-error.
jobs:
  published-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.23
          experimental: true
      # -tag published tests whatever is published now: a tag pinned here
      # went stale at every release and then failed every PR touching the checker.
      - name: Latest published README install and release check
        env:
          GH_TOKEN: ${{ github.token }}
        run: env PATH="/home/linuxbrew/.linuxbrew/bin:$PATH" mise exec -- go run ./tools/publicinstall -mode linux-hosted -fresh-installs 1 -tag published -out "$RUNNER_TEMP/dibs-public-linux"
      - name: Preserve the real receipt, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dibs-public-linux/receipt.json
            ${{ runner.temp }}/dibs-public-linux/*.log
          if-no-files-found: error
