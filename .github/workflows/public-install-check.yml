name: published Linux install

on:
  pull_request:
    paths:
      - .github/workflows/public-install-check.yml
      - tools/publicinstall/**
  workflow_dispatch:

permissions:
  contents: read

# A public-release acceptance finding, separate from the candidate's gate.
# A failing published install stays red and keeps its receipt; no continue-on-error.
jobs:
  published-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          experimental: true
      - name: Published v0.0.16 README install and release check
        run: env PATH="/home/linuxbrew/.linuxbrew/bin:$PATH" mise exec -- go run ./tools/publicinstall -mode linux-hosted -fresh-installs 1 -tag v0.0.16 -out "$RUNNER_TEMP/dibs-public-linux-v0.0.16"
      - name: Preserve the real receipt, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-linux-v0.0.16-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dibs-public-linux-v0.0.16/receipt.json
            ${{ runner.temp }}/dibs-public-linux-v0.0.16/*.log
          if-no-files-found: error
