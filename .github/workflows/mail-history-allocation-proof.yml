name: mail-history isolated allocation receipts
on:
  pull_request:
    paths:
      - tools/historyallocationproof/**
      - .github/workflows/mail-history-allocation-proof.yml
permissions:
  contents: read
jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 359ba2fe4df6d1c9d4a8ed555c55e1040a05cc0f
          path: allocation-before
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 689f3b4d447c4695e53878d58a04857047f0dbfd
          path: allocation-segments
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0f3508ea6fedc171a928df45a72b50efd24f6be4
          path: allocation-idle
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: b640e08d79e262e09a9f187cabf6d572e229a75a
          path: allocation-parser
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.7.7
          experimental: true
      - name: Same-runner resource receipts for each allocation stage
        run: mise exec -- go run ./tools/historyallocationproof
