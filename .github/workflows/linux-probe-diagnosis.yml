name: Linux native probe diagnosis
on:
  push:
    branches: [codex/linux-probe-fix-424716]
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DIBS_NOTIFY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.10.23
          experimental: true
      - name: Repeated focused runtime guards
        run: mise exec -- go test -race -count=10 -timeout=8m -v -run '^(TestASecondWakeIsNotQueuedBehindOneNotYetDelivered|TestTheEnvironmentIsReadableForUserBinaries|TestEmptyNativeEnvironmentCannotChooseAHeuristicOwner|TestUnknownEnvironmentCannotFeedSupervision)$' ./internal/engine ./internal/liveness

  old_supervision_control:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.10.23
          experimental: true
      - name: Old production source must fail the new supervision guard
        run: mise exec -- python3 tools/linux_probe_old_control.py
