name: mail-history API runtime controls

on:
  pull_request:
    paths:
      - tools/historyapiproof/**
      - .github/workflows/mail-history-api-proof.yml

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 77199e661395da932e2d5c77b07e3df3c182db02
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e771d2f6603cbed768025a1107615c524669c02b
          path: old
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c241fe34f3b50d0b67634c297741ee3fadadb237
          path: old-seek
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 240e99d19789de3a186aab7befe52ce3173dbcea
          path: old-cost
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.7.7
          experimental: true
      - name: Candidate baseline, old API absence, and discriminating runtime mutation controls
        run: mise exec -- go run ./tools/historyapiproof
