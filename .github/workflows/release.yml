name: release

# No tag-push trigger. Prove the exact tag environment locally BEFORE pushing;
# then dispatch publication at the tag to preserve the installed OIDC policy.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, publish-only, delivery-rehearsal]
        default: preflight
        required: true
      version:
        description: Canonical version without v
        type: string
        required: true
      sha:
        description: Full protected-main candidate SHA
        type: string
        required: true
      preflight_run:
        description: Successful main preflight run ID (publish-only)
        type: string
        required: false
      rehearsal_fail:
        description: Deliberately fail preflight; no remote tag may be created
        type: boolean
        default: false
      delivery_rehearsal:
        description: Run full preflight and rehearse token dispatch, never tag or publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DIBS_RELEASE_VERSION: ${{ inputs.version }}
  DIBS_RELEASE_SHA: ${{ inputs.sha }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  preflight:
    if: inputs.mode == 'preflight' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      DIBS_RELEASE_REHEARSAL: ${{ inputs.rehearsal_fail }}
      DIBS_RELEASE_DELIVERY_REHEARSAL: ${{ inputs.delivery_rehearsal }}
      PW_CHANNEL: ""
    steps:
      # Trusted workflow commit, NOT an arbitrary dispatch SHA before validation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
          experimental: true
      - name: validate exact protected-main candidate before secrets or build
        run: go run ./tools/releaseflow -phase validate
      - name: Playwright browser
        run: task e2e:deps
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: macOS signing preflight
        if: '!inputs.rehearsal_fail && !inputs.delivery_rehearsal'
        env:
          DIBS_SIGNING_P12: ${{ secrets.DIBS_SIGNING_P12 }}
          DIBS_SIGNING_P12_PASSWORD: ${{ secrets.DIBS_SIGNING_P12_PASSWORD }}
        run: go run ./tools/signrelease -import
      - name: local tag, WHOLE gate, production-stamped offline build and receipt
        run: go run ./tools/releaseflow -phase preflight
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dibs-preflight.json
          if-no-files-found: error
          retention-days: 90

  commit-tag:
    needs: preflight
    if: inputs.mode == 'preflight' && github.ref == 'refs/heads/main' && !inputs.delivery_rehearsal
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: push only the proven annotated tag
        run: go run ./tools/releaseflow -phase commit-tag

  release:
    if: inputs.mode == 'publish-only' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      DIBS_PREFLIGHT_RUN: ${{ inputs.preflight_run }}
    steps:
      # Authenticate with protected-main tooling BEFORE executing tag source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
          experimental: true
      - name: authenticate receipt before tag checkout or signing
        run: go run ./tools/releaseflow -phase authorize-receipt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: authenticate exact candidate checkout
        run: go run ./tools/releaseflow -phase authorize
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: embedded Sigstore root is current
        run: go run ./tools/sigstore-root-check
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: macOS signing identity
        env:
          DIBS_SIGNING_P12: ${{ secrets.DIBS_SIGNING_P12 }}
          DIBS_SIGNING_P12_PASSWORD: ${{ secrets.DIBS_SIGNING_P12_PASSWORD }}
        run: go run ./tools/signrelease -import
      - name: draft, stage, sign, verify uploaded bytes, publish; public retries are read-only
        run: go run ./tools/releaseflow -phase publish

  registry:
    needs: release
    uses: ./.github/workflows/publish-mcp.yml
    permissions:
      id-token: write
      contents: read
    with:
      version: ${{ inputs.version }}

  cask:
    needs: [release, registry]
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    env:
      DIBS_PREFLIGHT_RUN: ${{ inputs.preflight_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
      - name: authenticate receipt before tag checkout
        run: go run ./tools/releaseflow -phase authorize-receipt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: push signed cask review branch or verify already done
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: go run ./tools/releaseflow -phase cask
      - name: say what the cask still needs
        run: go run ./tools/casknote

  delivery-rehearsal:
    if: inputs.mode == 'delivery-rehearsal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
      - name: authenticate delivered rehearsal receipt; only this run record is written
        env:
          DIBS_PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: go run ./tools/releaseflow -phase delivery-rehearsal
