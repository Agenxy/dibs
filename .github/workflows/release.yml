name: release

# Nothing ran GoReleaser. The config was complete and validated and had never
# been executed by anything but a human, which meant tagging a release produced
# a tag and no artifacts, and the Homebrew cask, being generated at release
# time, did not exist at all.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload artifacts
  id-token: write # keyless cosign signing via OIDC

# Third-party actions are pinned to full commit SHAs, not tags.
#
# A tag is mutable: whoever controls the action's repository can move v7 to
# different code, and this workflow holds `contents: write` and `id-token: write`
# for keyless signing, so a moved tag could sign and publish artifacts nobody
# wrote. The project already pins its Go toolchain, its linter, GoReleaser, syft
# and cosign for weaker reasons than that. The trailing comment is the human
# readable version; the SHA is what is enforced.

jobs:
  release:
    # macOS, matching the CI gate. The binaries are CGO_ENABLED=0 and
    # cross-compiled, so the host only decides where the build ran, but it is
    # the platform this project verifies on, and a release built somewhere the
    # tests have never run is a different artifact than the one that was tested.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      # The gate runs again here rather than trusting that it ran on the commit.
      # A tag can point at anything, including a commit that never saw CI.
      #
      # It has to be the WHOLE gate. This ran `go test -race ./...` alone, which
      # is the part of the chain least likely to catch a release-breaking
      # problem: it does not build the panel, drive a browser, exercise the
      # channels, or enforce the coverage floor. A tag could therefore publish
      # signed binaries whose end-to-end suites had never been run against them.
      # The action, not `curl https://mise.run | sh`.
      #
      # Piping a mutable URL into a shell in a job that holds `contents: write`
      # and `id-token: write` undoes the pinning three lines above it: whoever
      # controls that host can run anything, with those permissions, and no
      # version or digest was recorded. The action is pinned to a SHA like
      # everything else here, and it handles trust + install itself.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.7
          experimental: true
      - name: Playwright browser
        run: cd internal/mcp/e2e && bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - name: task ci
        env:
          PW_CHANNEL: ""
        run: mise exec -- task ci

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Explicit, so CI and mise.toml install the same cosign. The default
          # floats, and the signing config here is cosign 3 (--bundle).
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "2.17.1" # pinned to match mise.toml
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A separate token, because the cask is committed to ANOTHER
          # repository (agenxy/homebrew-lanes) and the default GITHUB_TOKEN is
          # scoped to this one. Without it the release succeeds and the cask
          # silently is not published, which is the failure mode most likely to
          # go unnoticed: the artifacts are all there, and `brew upgrade` just
          # never sees the new version.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
