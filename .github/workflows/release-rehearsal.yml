name: full-publication rehearsal

# Mirror the EXACT candidate commit into the ONE operator-approved scratch
# repository, then dispatch at its unique tag. No production repository input,
# credentials, tag writer, registry publication or cask push lives here.
# The source target is UNBOUND until the operator chooses it: this file cannot
# enable itself, and the validator refuses before build/sign/publication.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical candidate version without v
        type: string
        required: true
      sha:
        description: Exact mirrored candidate full SHA
        type: string
        required: true
      discovery_negative_control:
        description: Regress ONLY get-by-tag discovery; expect failure before upload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-publication-rehearsal
  cancel-in-progress: false

env:
  DIBS_RELEASE_TARGET: rehearsal
  DIBS_RELEASE_VERSION: ${{ inputs.version }}
  DIBS_RELEASE_SHA: ${{ inputs.sha }}
  DIBS_RELEASE_DISCOVERY_NEGATIVE_CONTROL: ${{ inputs.discovery_negative_control }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  full-publication:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
          experimental: true
      - name: closed repository, exact candidate, unique tag; refuse before build/sign
        run: go run ./tools/releaseflow -phase full-publication-validate
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: shared publisher and read-only public retry; dry downstream plans only
        run: go run ./tools/releaseflow -phase full-publication
