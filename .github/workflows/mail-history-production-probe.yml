name: mail-history production resource probe

on:
  pull_request:
    paths:
      - internal/mailhistory/**
      - internal/ledger/mail_history*.go
      - internal/ledger/ledger.go
      - .github/workflows/mail-history-production-probe.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {records: 0, case: simple}
          - {records: 100000, case: simple}
          - {records: 1000000, case: simple}
          - {records: 2000000, case: simple}
          - {records: 1000000, case: many}
          - {records: 1000000, case: rich}
          - {records: 1000000, case: adopt-merge}
    env:
      DIBS_HISTORY_PROBE_RECORDS: ${{ matrix.records }}
      DIBS_HISTORY_PROBE_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.7.7
          experimental: true
      - name: Generate identical encrypted ledger for both arms
        env:
          DIBS_HISTORY_PROBE_ARM: generate
        run: mise exec -- go test -count=1 -timeout=20m -run '^TestMailHistoryProductionProbe$' -v ./internal/ledger
      - name: Baseline replay without the derived observer
        env:
          DIBS_HISTORY_PROBE_ARM: baseline
        run: mise exec -- go test -count=1 -timeout=20m -run '^TestMailHistoryProductionProbe$' -v ./internal/ledger
      - name: First baseline repeat on the same runner
        env:
          DIBS_HISTORY_PROBE_ARM: baseline-repeat-1
        run: mise exec -- go test -count=1 -timeout=20m -run '^TestMailHistoryProductionProbe$' -v ./internal/ledger
      - name: Second baseline repeat on the same runner
        env:
          DIBS_HISTORY_PROBE_ARM: baseline-repeat-2
        run: mise exec -- go test -count=1 -timeout=20m -run '^TestMailHistoryProductionProbe$' -v ./internal/ledger
      - name: Production boot replay then private post-serving history fold
        id: production
        env:
          DIBS_HISTORY_PROBE_ARM: production
        run: mise exec -- go test -count=1 -timeout=20m -run '^TestMailHistoryProductionProbe$' -v ./internal/ledger
      - name: Profile a failed 1M simple replay diagnostically
        id: profile
        if: ${{ failure() && steps.production.outcome == 'failure' && matrix.records == 1000000 && matrix.case == 'simple' }}
        env:
          DIBS_HISTORY_PROBE_ARM: production
        run: mise exec -- go test -count=1 -timeout=20m -cpuprofile=/tmp/dibs-history-production.cpu -run '^TestMailHistoryProductionProbe$' -v ./internal/ledger
      - name: Show CPU costs without replacing the unprofiled acceptance measurement
        if: ${{ always() && steps.profile.outcome != 'skipped' && steps.profile.outcome != '' }}
        run: mise exec -- go tool pprof -top -nodecount=35 /tmp/dibs-history-production.cpu
      - name: Show cumulative history CPU costs
        if: ${{ always() && steps.profile.outcome != 'skipped' && steps.profile.outcome != '' }}
        run: mise exec -- go tool pprof -top -cum -focus=mailhistory -nodecount=25 /tmp/dibs-history-production.cpu
