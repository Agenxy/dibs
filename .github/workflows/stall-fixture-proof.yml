name: stall fixture proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  macos-twenty:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.7.7
          experimental: true
      - name: twenty race-enabled repetitions of the wake fixture
        run: mise exec -- go test -race ./internal/engine -run '^TestAWorkerSeenSinceItsLastStopIsNotWokenForItsWork$' -count=20
