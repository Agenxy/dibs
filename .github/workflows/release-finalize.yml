name: release finalizer
on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      # ONLY trusted protected main. No tag/source/artifact code is executed.
      # This job cannot write contents or obtain an OIDC signing token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
      - name: authenticate completed receipt and dispatch at the exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          DIBS_PREFLIGHT_RUN: ${{ github.event.workflow_run.id }}
        run: go run ./tools/releaseflow -phase finalize
