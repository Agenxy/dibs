name: focus regression proof
on:
  pull_request:
    branches: [codex/chatgpt-focus-restore-42656]
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7
          experimental: true
      - name: isolated Python runner
        run: mise install uv@0.9.5
      - name: retain the exact pre-feature parent source
        run: git fetch --no-tags origin refs/pull/375/head:refs/focusproof/old
      - name: current GREEN and labeled old and mutation RED
        run: mise exec uv@0.9.5 -- uv run --script tools/focusproof.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: focus-regression-proof
          path: focus-proof-logs
